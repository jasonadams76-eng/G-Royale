<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Storm Royale</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;width:100%}
  canvas{display:block;touch-action:none}

  /* ----- menu / lobby ----- */
  #menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(8,14,8,.80);touch-action:pan-y;overflow:auto}
  #menu.hide{display:none}
  .card{box-sizing:border-box;width:min(340px,calc(100% - 24px));max-height:calc(100% - 12px);overflow:auto;
    background:#16221a;border:2px solid #3a5a40;border-radius:14px;padding:16px 16px 12px;color:#eee;text-align:center}
  .logo{display:block;width:min(300px,100%);height:auto;margin:0 auto 8px}
  @media (max-height:520px){.logo{width:190px}}
  .card p{margin:8px 0;font-size:14px;color:#cde}
  .card .hint{font-size:12px;color:#9ab;min-height:30px}
  .card [hidden]{display:none}
  .btn{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:12px;font-size:17px;font-weight:700;
    color:#102010;background:#fc4;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation}
  .btn.ghost{background:#2a3b30;color:#cde;font-weight:600}
  .btn.sel{outline:3px solid #fff}
  .row{display:flex;gap:8px}.row .btn{margin:8px 0}
  #roomcode{font-size:38px;font-weight:800;letter-spacing:8px;color:#fc4;margin:6px 0;-webkit-user-select:text;user-select:text}
  .txt{box-sizing:border-box;width:100%;font-size:30px;text-align:center;letter-spacing:8px;text-transform:uppercase;
    padding:8px;border-radius:10px;border:2px solid #3a5a40;background:#0d1610;color:#fff;
    -webkit-user-select:text;user-select:text}
  .txt.name{font-size:20px;letter-spacing:1px;text-transform:none;padding:9px;margin-bottom:6px}
  .ver{font-size:10px;color:#6a7;margin:2px 0 4px;opacity:.8}
  .lbl{display:block;text-align:left;font-size:12px;color:#9ab;margin:0 0 3px 2px}
  .card .small{font-size:12px;margin:2px 0;color:#9ab}
  #plist{margin:8px 0;text-align:left}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1f3326;border:1px solid #2f4a37;
    border-radius:10px;padding:6px 10px;margin:5px 0;font-size:15px;min-height:30px}
  .prow.me{border-color:#fc4}
  .prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;color:#9ab;margin-left:6px}
  .tag.win{color:#fc4;font-weight:700}
  .team{border:2px solid #6c6;border-radius:12px;padding:3px 6px 4px;margin:6px 0;background:#17301d}
  .team .tl{font-size:11px;color:#8f8;text-transform:uppercase;letter-spacing:1px;margin:2px 4px}
  .team .prow{margin:3px 0}
  .mini{padding:6px 11px;font-size:13px;font-weight:700;border:0;border-radius:8px;background:#fc4;color:#102010;
    touch-action:manipulation;cursor:pointer;flex:none}
  .mini.no{background:#a44;color:#fff}
  .mini:disabled{opacity:.5}
  .inv{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#3a2f10;border:1px solid #fc4;
    border-radius:10px;padding:6px 10px;margin:5px 0;font-size:14px;text-align:left}
  .inv .bt{display:flex;gap:6px;flex:none}
  #msg{min-height:18px;color:#f88;font-size:13px}
  #exit{display:none;position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:5;padding:5px 12px;font-size:12px;
    font-weight:700;color:#fff;background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #snd{position:fixed;top:6px;left:calc(50% + 46px);z-index:30;width:34px;height:30px;padding:0;font-size:16px;line-height:1;color:#fff;
    background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #mus{position:fixed;top:6px;left:calc(50% + 86px);z-index:30;width:34px;height:30px;padding:0;font-size:16px;line-height:1;color:#fff;
    background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #toast{display:none;position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;
    background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;text-align:center;max-width:90%}
</style>
</head>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- Screen / scaling ----------
// SW,SH = screen size in CSS px. VW,VH = world-view size (screen / ZOOM).
let DPR = 1, ZOOM = 1, SW = 0, SH = 0, VW = 0, VH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  cv.width = Math.round(SW*DPR); cv.height = Math.round(SH*DPR);
  cv.style.width = SW+'px'; cv.style.height = SH+'px';
  ZOOM = Math.max(0.6, Math.min(1, Math.min(SW,SH)/700)); // zoom out a bit on small screens
  VW = SW/ZOOM; VH = SH/ZOOM;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// Stop page scroll / pinch-zoom / rubber-banding on phones (but let the menu scroll)
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('#menu'))) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault(), {passive:false});

// ---------- Config ----------
const W = 4000, G = 48, BOTS = 24, CENTER = {x: W/2, y: W/2};
const TREE_COUNT = 320;
const WEAP = {
  pickaxe: {name:'Pickaxe', melee:true, dmg:20, rate:0.5, range:55, color:'#bbb'},
  pistol:  {name:'Pistol',  dmg:18, rate:0.33, spd:950, spread:0.03, pellets:1, life:0.7, color:'#9cf'},
  shotgun: {name:'Shotgun', dmg:11, rate:0.9,  spd:850, spread:0.22, pellets:7, life:0.4, color:'#fa5'},
  ar:      {name:'Rifle',   dmg:12, rate:0.11, spd:1100,spread:0.06, pellets:1, life:0.8, color:'#9f6'},
  bandage: {name:'Bandage', heal:true, color:'#fff'},
  med:     {name:'Medkit',  heal:true, color:'#f55'},
  shield:  {name:'Shield',  heal:true, color:'#58f'},
  grenade: {name:'Grenade', grenade:true, color:'#fc0'},
  boots:   {name:'Speed Boots', passive:true, color:'#e8a317'}
};
const STACK = {};   // stackable loadout items: how many fit in one slot, how long they take to use, and where the count is kept
const MAXBAND = 3, BANDAGE_HEAL = 25, HEAL_TIME = 1.5, MAXMED = 2, MED_TIME = 3.0,   // a medkit heals to full health but takes longer to use
  MAXSHD = 2, SHD_TIME = 2.0, SHIELD_GAIN = 40,   // shield potions: two per slot, each adds 40 shield
   WEAPON_PRIO = ['ar','shotgun','pistol'];
STACK.bandage = {key:'band', max:MAXBAND, time:HEAL_TIME};
STACK.med     = {key:'med',  max:MAXMED,  time:MED_TIME};
STACK.shield  = {key:'shd',  max:MAXSHD,  time:SHD_TIME};
// Grenades: rare (always Gold) specialty items. One per slot; thrown at a spot within GR_RANGE, they explode there.
const GR_RANGE = 520, GR_RADIUS = 140, GR_DMG_MAX = 130, GR_DMG_MIN = 60, GR_SPEED = 560, GR_CHANCE = 0.07;   // GR_CHANCE: odds per chest
const BOOT_MULT = 1.5, BOOT_RAR = 4, bootMul = a => a.inv.includes('boots') ? BOOT_MULT : 1;   // speed boots: 1.5x move speed while in your loadout (one pair per match)
const CHEST_COUNT = 32, CHEST_WEAPONS = ['pistol','pistol','pistol','shotgun','shotgun','ar','ar'];  // weighted odds
// Gun rarities: the rarer the gun, the harder it hits, the faster it fires and the straighter it shoots.
const RARITY = [
  {name:'White',  col:'#c3ccd2', dmg:1.00, rate:1.00, spread:1.00, odds:58},
  {name:'Green',  col:'#3ddc4a', dmg:1.10, rate:0.96, spread:0.90, odds:24},
  {name:'Blue',   col:'#3b8cff', dmg:1.20, rate:0.92, spread:0.80, odds:12},
  {name:'Purple', col:'#b45cff', dmg:1.35, rate:0.86, spread:0.70, odds:5},
  {name:'Gold',   col:'#ffc400', dmg:1.55, rate:0.78, spread:0.55, odds:1}     // about 1 gun in 100
];
function rollRarity(){
  let r = Math.random() * RARITY.reduce((t, x) => t + x.odds, 0);
  for (let i = 0; i < RARITY.length; i++){ r -= RARITY[i].odds; if (r < 0) return i; }
  return 0;
}
const newGr = () => ({pistol:0, shotgun:0, ar:0});     // rarity of the gun held for each type (you can hold one of each)
const TYPES = ['pistol','shotgun','ar','bandage','shield','med','wood','grenade','boots'];   // index used on the wire
const PHASES = [
  {wait:20, shrink:20, r:1700}, {wait:15, shrink:15, r:1100},
  {wait:12, shrink:12, r:600},  {wait:10, shrink:10, r:250},
  {wait:8,  shrink:8,  r:60}
];

// ---------- Game / network state ----------
let phase = 'menu';          // 'menu' | 'lobby' | 'play'
const MAX_PLAYERS = 8;
const PLAYER_COLORS = ['#4af','#fa4','#e5e','#5e8','#ee4','#f66','#4ee','#a8f'];
const NET = {
  role:'solo',               // 'solo' | 'host' | 'guest'
  peer:null,                 // PeerJS peer
  conn:null,                 // guest: the connection to the host
  peers:{},                  // host: pid -> {conn, name}
  code:'', myPid:0, nextPid:1,
  snapAcc:0, inAcc:0, lastSnap:0, lost:false, left:false,
  last:{W:'',L:'',C:'',T:''},
  lobby:[],                  // host: the real lobby [{pid, name, mate}]
  view:null,                 // what the lobby screen shows (host and guests)
  invites:[],                // host: pending team-up invites [{from, to}]
  incoming:[],               // invites waiting for my answer [{from, name}]
  sent:new Set()             // players I have invited
};
function netSend(m){ try { if (NET.conn && NET.conn.open) NET.conn.send(m); } catch(_){} }

// ---------- Input ----------
let touchMode = matchMedia('(pointer: coarse)').matches;
const keys = {}, mouse = {x:0, y:0, down:false};
const STICK_R = 55;
const touch = {move:null, aim:null};   // each: {id, ox, oy, dx, dy}

// local-player actions (routed over the network when we are the guest)
function selectSlot(i){
  const me = S.player;
  if (!me.alive || !me.inv[i]) return;
  me.cur = i;
  if (NET.role === 'guest'){ me.selHold = performance.now() + 400; netSend({t:'sel', i}); }
}
function doBuild(){ if (NET.role === 'guest') netSend({t:'build'}); else build(S.player); }
function throwAtScreen(x, y){
  const cam = camera(), wx = x/ZOOM + cam.x, wy = y/ZOOM + cam.y;
  if (NET.role === 'guest') netSend({t:'throw', x:Math.round(wx), y:Math.round(wy)}); else throwGrenade(S.player, wx, wy);
}
const holdingGrenade = () => S && S.player && S.player.alive && S.player.inv[S.player.cur] === 'grenade';
function doDrop(){ if (NET.role === 'guest') netSend({t:'drop'}); else dropItem(S.player); }
const dropBtn = () => ({x:SW-190, y:SH-148, r:26});
const canDropNow = () => { const p = S && S.player; return !!(p && p.alive && p.cur > 0 && p.inv[p.cur]); };
function doHeal(){ if (NET.role === 'guest') netSend({t:'heal'}); else startHeal(S.player); }
function tryRestart(){
  if (!S.over || performance.now() - S.overAt < 700) return;
  if (NET.role === 'guest') netSend({t:'restart'}); else hostRestart();
}

addEventListener('keydown', e => {
  if (phase !== 'play' || (e.target && e.target.tagName === 'INPUT')) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.key >= '1' && e.key <= '6') selectSlot(e.key-1);
  if (k === 'q') doBuild();
  if (k === 'g') doDrop();
  if (k === 'r') tryRestart();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
addEventListener('contextmenu', e => e.preventDefault());

// UI hit areas (shared by drawing and touch handling)
function slotRect(i){
  return touchMode ? {x:12+i*46, y:50, w:42, h:36}
                   : {x:SW/2-195+i*66, y:SH-70, w:60, h:50};
}
function buildBtn(){ return {x:SW-190, y:SH-80, r:32}; }
const inRect = (r,x,y) => x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;

let fsTried = false;
function tryFullscreen(){
  if (fsTried) return; fsTried = true;
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement){
      Promise.resolve(req.call(el))
        .then(() => { try { screen.orientation.lock('landscape').catch(()=>{}); } catch(_){} })
        .catch(()=>{});
    }
  } catch(_){}
}

const taps = {};
addEventListener('pointerdown', e => {
  if (phase !== 'play') return;
  const x = e.clientX, y = e.clientY;
  if (e.pointerType === 'mouse'){
    if (e.target !== cv) return;
    touchMode = false; mouse.x = x; mouse.y = y;
    if (e.button === 0){
      if (S.over){ tryRestart(); return; }
      for (let i=0;i<6;i++){          // clicking a loadout slot switches to it (without firing)
        if (inRect(slotRect(i), x, y)){ const me = S.player; if (me.alive && me.inv[i]) selectSlot(i); return; }
      }
      if (holdingGrenade()){ throwAtScreen(x, y); return; }       // grenade: click where to throw it
      mouse.down = true;
    }
    if (e.button === 2){       // right-click a slot to drop its item, anywhere else to build
      for (let i=0;i<6;i++) if (inRect(slotRect(i), x, y)){ if (S.player.alive && S.player.inv[i]){ selectSlot(i); doDrop(); } return; }
      doBuild();
    }
    return;
  }
  if (e.target !== cv) return;
  touchMode = true;
  e.preventDefault();
  if (S.over){ tryRestart(); return; }
  for (let i=0;i<6;i++){
    if (inRect(slotRect(i), x, y)){
      const me = S.player;
      if (me.alive && me.inv[i]){
        selectSlot(i);
        if (STACK[me.inv[i]]) doHeal();   // tapping a healing/shield slot uses it
      }
      return;
    }
  }
  const b = buildBtn();
  if (Math.hypot(x-b.x, y-b.y) <= b.r+10){ doBuild(); return; }
  const db = dropBtn();
  if (canDropNow() && Math.hypot(x-db.x, y-db.y) <= db.r+10){ doDrop(); return; }
  taps[e.pointerId] = {x, y, t:performance.now()};          // a quick tap with a grenade selected throws it there
  const side = x < SW/2 ? 'move' : 'aim';
  if (!touch[side]) touch[side] = {id:e.pointerId, ox:x, oy:y, dx:0, dy:0};
});
addEventListener('pointermove', e => {
  if (phase !== 'play') return;
  if (e.pointerType === 'mouse'){ touchMode = false; mouse.x = e.clientX; mouse.y = e.clientY; return; }
  for (const k of ['move','aim']){
    const s = touch[k];
    if (s && s.id === e.pointerId){
      let dx = e.clientX - s.ox, dy = e.clientY - s.oy; const m = Math.hypot(dx,dy);
      if (m > STICK_R){ dx = dx/m*STICK_R; dy = dy/m*STICK_R; }
      s.dx = dx; s.dy = dy;
    }
  }
});
function endPointer(e){
  if (e.pointerType === 'mouse'){ if (e.type === 'pointercancel' || e.button === 0) mouse.down = false; return; }
  for (const k of ['move','aim']) if (touch[k] && touch[k].id === e.pointerId) touch[k] = null;
  const tp = taps[e.pointerId]; delete taps[e.pointerId];
  if (tp && e.type === 'pointerup' && phase === 'play' && performance.now() - tp.t < 350 && Math.hypot(e.clientX - tp.x, e.clientY - tp.y) < 16 && holdingGrenade()) throwAtScreen(tp.x, tp.y);
  tryFullscreen(); // needs a completed tap to count as a user gesture
}
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);

// ---------- State ----------
let S, last = performance.now();
const rnd = (a,b) => a + Math.random()*(b-a);

// kind: 'human' (h = {pid, name}) or 'bot'
function newActor(kind, i, h){
  const human = kind === 'human', pid = human ? h.pid : -1;
  const x = Math.round(rnd(200,W-200)), y = Math.round(rnd(200,W-200));
  const a = {x, y, tx:x, ty:y, r:15, hp:100, sh:0, wood:human?60:30,
    inv:['pickaxe',null,null,null,null,null], gr:newGr(), band:0, med:0, shd:0, heal:0, cur:0, angle:0, cd:0, swing:0, alive:true, kills:0, place:0,
    isPlayer:human, pid, team:'', in:null,
    name: human ? h.name : 'Bot '+i,
    color: human ? PLAYER_COLORS[pid % PLAYER_COLORS.length] : `hsl(${rnd(0,360)|0},60%,55%)`,
    strafe:1, strafeT:0, wp:null, wpT:0};
  return a;
}

// Team id of a human: partners share one, everyone else is on their own.
const teamIdOf = h => 'H' + (h.mate != null ? Math.min(h.pid, h.mate) : h.pid);
// How many bot teams play, and how big they are.
// Bots play in duos once any human duo exists (otherwise solo). The field keeps the same number of teams:
// every human team beyond the first replaces one bot team.
function botPlan(humans){
  const humanTeams = new Set(humans.map(teamIdOf)).size;
  const size = humans.some(h => h.mate != null) ? 2 : 1, base = BOTS / size;
  return {size, teams: Math.max(0, base - Math.max(0, humanTeams - 1))};
}

// Builds a fresh match on this device: solo, or the host of a multiplayer game.
// humans = [{pid, name, mate}] (pid 0 is the host)
function init(humans){
  humans = humans || [{pid:0, name:cleanName($('pname').value) || 'Player 1', mate:null}];
  S = {actors:[], players:[], bullets:[], trees:[], loot:[], chests:[], walls:new Map(), particles:[], ev:[], grenades:[], blasts:[], bm:[],
    over:false, winTeam:null, overAt:0,
    storm:{i:0, state:'wait', t:PHASES[0].wait, r:2900, rFrom:2900, rTo:PHASES[0].r}};
  for (let i=0;i<TREE_COUNT;i++) S.trees.push({id:i, x:Math.round(rnd(100,W-100)), y:Math.round(rnd(100,W-100)), r:22, wood:100});
  // no loot lies on the ground at the start: everything comes from chests (or from eliminated players)
  for (let n=0;n<CHEST_COUNT;n++){
    for (let tries=0;tries<30;tries++){
      const x = Math.round(rnd(150,W-150)), y = Math.round(rnd(150,W-150));
      if (S.trees.every(t => Math.hypot(t.x-x, t.y-y) > 50)){ S.chests.push({x, y, open:false}); break; }
    }
  }
  if (S.chests.length) S.chests[Math.random()*S.chests.length|0].boots = true;     // exactly one chest on the map holds the speed boots
  const clampW = v => Math.max(100, Math.min(W-100, Math.round(v)));
  const byPid = {};

// ---------- Helpers ----------
const wallKey = (gx,gy) => gx+','+gy;
function build(a){
  if (!a.alive || a.wood < 10) return;
  const gx = Math.floor((a.x + Math.cos(a.angle)*62)/G), gy = Math.floor((a.y + Math.sin(a.angle)*62)/G);
  const k = wallKey(gx,gy);
  if (S.walls.has(k) || gx<0 || gy<0 || gx*G>=W || gy*G>=W) return;
  S.walls.set(k, {gx, gy, hp:150}); a.wood -= 10; sfx('bd', a.x, a.y);
}
function damage(a, dmg, owner){
  a.heal = 0;   // taking damage interrupts healing
  if (a.sh > 0){ const s = Math.min(a.sh, dmg); a.sh -= s; dmg -= s; }
  a.hp -= dmg; a.lastHit = performance.now();
  if (dmg > 0 && a.alive) sfx('hit', a.x, a.y);
  if (a === S.player && touchMode && NET.role !== 'guest' && navigator.vibrate && a.lastHit - (a.lastVib||0) > 150){
    a.lastVib = a.lastHit; navigator.vibrate(a.hp <= 0 ? 200 : 20);
  }
  if (a.hp <= 0 && a.alive){
    a.alive = false; a.hp = 0; sfx('ko', a.x, a.y);
    if (owner && owner !== a) owner.kills++;
    a.place = S.actors.filter(x => x.alive).length + 1;
    // drop the whole inventory: all wood in one pile, plus every weapon and bandage
    if (a.wood > 0) S.loot.push({x:a.x, y:a.y, type:'wood', n:a.wood});
    a.inv.forEach(w => {
      if (!w || w === 'pickaxe') return;
      const n = STACK[w] ? a[STACK[w].key] : 1;
      for (let i=0;i<n;i++) S.loot.push({x:a.x+rnd(-20,20), y:a.y+rnd(-20,20), type:w, rar:GUN_W[w] ? a.gr[w] : w === 'grenade' ? 4 : w === 'boots' ? BOOT_RAR : 0});
    });
  }
}
function fire(a){
  if (!a.alive) return;
  const w = WEAP[a.inv[a.cur]];
  if (w.grenade || w.passive) return;                 // grenades are thrown at a spot, not fired
  if (w.heal){ startHeal(a); return; }
  if (a.cd > 0) return;
  const rm = RARITY[w.melee || w.heal ? 0 : (a.gr[a.inv[a.cur]] || 0)];
  a.cd = w.rate * rm.rate;
  if (w.melee){
    a.swing = 0.2; sfx('sw', a.x, a.y);
    for (const t of S.trees){
      const d = Math.hypot(t.x-a.x, t.y-a.y);
      if (d < w.range + t.r){
        const diff = Math.abs(Math.atan2(Math.sin(Math.atan2(t.y-a.y,t.x-a.x)-a.angle), Math.cos(Math.atan2(t.y-a.y,t.x-a.x)-a.angle)));

  }
}

// ---------- Grenades ----------
function throwGrenade(a, tx, ty){
  if (!a.alive || a.inv[a.cur] !== 'grenade' || !isFinite(tx) || !isFinite(ty)) return;
  let dx = tx - a.x, dy = ty - a.y; const d = Math.hypot(dx, dy) || 1;
  const reach = Math.max(30, Math.min(GR_RANGE, d));              // taps beyond the range land at the edge of it
  dx = dx/d*reach; dy = dy/d*reach;
  a.inv[a.cur] = null; a.cur = 0;                                  // the grenade is used up
  S.grenades.push({sx:a.x, sy:a.y, x:a.x, y:a.y, tx:a.x+dx, ty:a.y+dy, t:0, dur:Math.max(0.3, reach/GR_SPEED), owner:a});
  a.angle = Math.atan2(dy, dx); sfx('th', a.x, a.y);
}
function explode(g){
  burst(g.tx, g.ty, '#fa4', 26); burst(g.tx, g.ty, '#fd5', 14);
  sfx('bm', g.tx, g.ty);
  S.blasts.push({x:g.tx, y:g.ty, t0:performance.now()});
  if (NET.role === 'host' && peerCount()) S.bm.push([Math.round(g.tx), Math.round(g.ty)]);
  for (const o of S.actors){
    if (!o.alive) continue;
    if (o !== g.owner && g.owner && o.team === g.owner.team) continue;      // teammates are never hurt (you can hurt yourself)
    const d = Math.hypot(o.x - g.tx, o.y - g.ty);
    if (d < GR_RADIUS + o.r) damage(o, GR_DMG_MAX - (GR_DMG_MAX - GR_DMG_MIN) * Math.min(1, d / GR_RADIUS), g.owner);
  }
  for (const [k, w] of [...S.walls]){                                         // the blast flattens walls
    if (Math.hypot(w.gx*G + G/2 - g.tx, w.gy*G + G/2 - g.ty) < GR_RADIUS + G/2) S.walls.delete(k);
  }
}

// Slot 0 = pickaxe, slots 1-5 = loadout. Bandages stack up to MAXBAND in a single slot.
function gunToast(type, rar, upgrade){ toast((upgrade ? 'Upgraded to ' : 'Picked up ') + RARITY[rar].name + ' ' + WEAP[type].name, 1800); }

    if (a.inv.includes('boots')) return false;

    a.inv[gi] = 'grenade'; if (a.isPlayer) a.cur = gi; return true;
  }
  // guns: one of each type. A better one replaces the one you hold, which drops to the ground.
  const have = a.inv.indexOf(type);
  if (have >= 0){
    if (rar <= a.gr[type]) return false;
    S.loot.push({x:a.x+rnd(-26,26), y:a.y+rnd(-26,26), type, rar:a.gr[type]});
    a.gr[type] = rar; if (a === S.player) gunToast(type, rar, true); return true;
  }
  const i = a.inv.indexOf(null, 1);
  if (i < 0) return false;
  a.inv[i] = type; a.gr[type] = rar; if (a.isPlayer) a.cur = i;
  if (a === S.player) gunToast(type, rar, false);

}
const healTime = a => (STACK[a.inv[a.cur]] || STACK.bandage).time;
function startHeal(a){
  if (!a.alive || a.heal > 0) return;
  const it = a.inv[a.cur], st = STACK[it];
  if (!st || a[st.key] <= 0) return;
  if (it === 'shield' ? a.sh >= 100 : a.hp >= 100) return;      // nothing to heal
  a.heal = st.time;
}
// Drop whatever is in the selected slot (the whole stack) onto the ground in front of you to free the slot.
function dropItem(a){
  if (!a.alive) return;
  const i = a.cur, it = a.inv[i];
  if (!it || it === 'pickaxe') return;
  const st = STACK[it], n = st ? a[st.key] : 1;
  const rar = GUN_W[it] ? a.gr[it] : it === 'grenade' ? 4 : it === 'boots' ? BOOT_RAR : 0;
  const px = Math.max(20, Math.min(W-20, a.x + Math.cos(a.angle)*60)), py = Math.max(20, Math.min(W-20, a.y + Math.sin(a.angle)*60));
  for (let k=0;k<n;k++) S.loot.push({x:px + (n>1 ? rnd(-14,14) : 0), y:py + (n>1 ? rnd(-14,14) : 0), type:it, rar, ban:a.pid, until:performance.now()+1500});
  if (st) a[st.key] = 0;
  if (GUN_W[it]) a.gr[it] = 0;
  a.heal = 0; a.inv[i] = null; a.cur = 0; sfx('pk', a.x, a.y);
}
function bestSlot(a){
  for (const t of WEAPON_PRIO){ const i = a.inv.indexOf(t); if (i >= 0) return i; }
  return 0;
}

function openChest(c){
  c.open = true;
  const pick = () => CHEST_WEAPONS[Math.random()*CHEST_WEAPONS.length|0];
  const gun = () => ({type:pick(), rar:rollRarity()});
  const drops = [gun()];                                    // always one weapon (rarity rolled: mostly white, gold is about 1 in 100)
  if (Math.random() < 0.55) for (let i = 1 + (Math.random()*3|0); i > 0; i--) drops.push({type:'bandage'});   // 55%: 1-3 bandages
  if (Math.random() < 0.25) drops.push(gun());              // 25% chance of a bonus weapon
  if (Math.random() < 0.45) drops.push({type:'shield'});    // 45% shield potion
  if (Math.random() < 0.30) drops.push({type:'med'});       // 30% medkit
  if (c.boots) drops.push({type:'boots', rar:BOOT_RAR});
  if (Math.random() < GR_CHANCE) drops.push({type:'grenade', rar:4});   // 7%: a (gold) grenade
  const off = Math.random()*Math.PI*2;
  drops.forEach((dr,i) => {
    const ang = off + i*Math.PI*2/drops.length, d = rnd(40,55);
    S.loot.push({x:Math.max(20,Math.min(W-20,c.x+Math.cos(ang)*d)), y:Math.max(20,Math.min(W-20,c.y+Math.sin(ang)*d)), type:dr.type, rar:dr.rar || 0});
  });
  burst(c.x, c.y, '#fc4', 14); sfx('cs', c.x, c.y);
}
// can this actor actually use a loot item right now? (keeps bots from chasing things they can't take)
function canTake(a, l){
  const type = l.type;
  if (type === 'wood') return true;
  const st = STACK[type];
  if (st) return a[st.key] < st.max && (a.inv.includes(type) || a.inv.includes(null));     // only if there is room for it
  if (type === 'boots') return !a.inv.includes('boots') && a.inv.includes(null);
  if (type === 'grenade') return a.inv.includes(null);
  if (a.inv.includes(type)) return (l.rar || 0) > a.gr[type];     // already holding one: only a better one is worth taking
  return a.inv.includes(null);
}

function collide(a){
  for (const t of S.trees){
    const dx = a.x-t.x, dy = a.y-t.y, d = Math.hypot(dx,dy), m = a.r+t.r*0.8;
    if (d < m && d > 0){ a.x = t.x + dx/d*m; a.y = t.y + dy/d*m; }
  }
  const cx = Math.floor(a.x/G), cy = Math.floor(a.y/G);
  for (let gx=cx-1; gx<=cx+1; gx++) for (let gy=cy-1; gy<=cy+1; gy++){
    if (!S.walls.has(wallKey(gx,gy))) continue;
    const nx = Math.max(gx*G, Math.min(a.x, gx*G+G)), ny = Math.max(gy*G, Math.min(a.y, gy*G+G));
    const dx = a.x-nx, dy = a.y-ny, d = Math.hypot(dx,dy);
    if (d < a.r){
      if (d > 0){ a.x = nx + dx/d*a.r; a.y = ny + dy/d*a.r; }
      else a.y -= a.r;
    }
  }
  a.x = Math.max(a.r, Math.min(W-a.r, a.x)); a.y = Math.max(a.r, Math.min(W-a.r, a.y));
}

// ---------- Bot AI ----------
function botThink(b, dt){
  const armed = b.inv.some(w => w && WEAP[w] && WEAP[w].spd);
  let target = null, best = armed ? 450 : 110;   // unarmed bots only fight what is right next to them; otherwise they go find a chest
  for (const o of S.actors){
    if (o === b || !o.alive || o.team === b.team) continue;
    const d = Math.hypot(o.x-b.x, o.y-b.y);
    if (d < best){ best = d; target = o; }
  }
  const sd = Math.hypot(b.x-CENTER.x, b.y-CENTER.y);
  let mx = 0, my = 0, speed = 190;
  if (sd > S.storm.r - 100){
    const a = Math.atan2(CENTER.y-b.y, CENTER.x-b.x); mx = Math.cos(a); my = Math.sin(a); speed = 230;
    if (target) b.angle = Math.atan2(target.y-b.y, target.x-b.x);
  } else if (target){
    const a = Math.atan2(target.y-b.y, target.x-b.x);
    const want = a + rnd(-0.05,0.05);
    const diff = Math.atan2(Math.sin(want-b.angle), Math.cos(want-b.angle));
    b.angle += diff * Math.min(1, dt*7);
    b.strafeT -= dt; if (b.strafeT <= 0){ b.strafe *= -1; b.strafeT = rnd(0.8,2); }
    const fwd = best > 280 ? 1 : best < 150 ? -1 : 0;
    mx = Math.cos(a)*fwd + Math.cos(a+Math.PI/2)*b.strafe*0.7;
    my = Math.sin(a)*fwd + Math.sin(a+Math.PI/2)*b.strafe*0.7;
    const gi = b.inv.indexOf('grenade');
    if (gi >= 0 && best > 150 && best < GR_RANGE - 30 && Math.random() < dt*1.2){ b.cur = gi; throwGrenade(b, target.x, target.y); return [0,0]; }
    // pick best weapon
    b.cur = bestSlot(b);
    if (b.cur === 0 && best < 70 || b.cur !== 0 && Math.abs(diff) < 0.35) fire(b);
    if (b.cur === 0 && best > 70) { mx = Math.cos(a); my = Math.sin(a); }
    if (b.hp < 50 && b.wood >= 10 && Math.random() < dt*2) build(b);
  } else {
    // heal when no one is nearby
    const want = (b.med > 0 && b.hp < 50) ? 'med' : (b.band > 0 && b.hp < 70) ? 'bandage' : (b.shd > 0 && b.sh < 60) ? 'shield' : null;
    if (b.heal > 0 || want){
      const kind = (b.heal > 0 && STACK[b.inv[b.cur]]) ? b.inv[b.cur] : want;
      const bi = b.inv.indexOf(kind);
      if (bi >= 0){ b.cur = bi; startHeal(b); return [0,0]; }
    }
    // seek loot / chests or wander
    let near = null, nd = armed ? 700 : 1800;   // an unarmed bot heads for the nearest chest, even a long way off
    for (const l of S.loot){ if (!canTake(b, l)) continue; const d = Math.hypot(l.x-b.x,l.y-b.y); if (d < nd){ nd = d; near = l; } }
    for (const c of S.chests){ if (c.open) continue; const d = Math.hypot(c.x-b.x,c.y-b.y); if (d < nd){ nd = d; near = c; } }
    // duo partners stick together: regroup if they have drifted apart
    const mate = S.actors.find(o => o !== b && o.alive && o.team === b.team);
    if (mate && near && Math.hypot(near.x-mate.x, near.y-mate.y) > 380) near = null;   // don't wander off to loot far from the partner
    if (mate && Math.hypot(mate.x-b.x, mate.y-b.y) > 240) b.wp = {x:mate.x, y:mate.y};
    else if (near) b.wp = {x:near.x,y:near.y};
    else { b.wpT -= dt; if (!b.wp || b.wpT <= 0){ b.wp = {x:CENTER.x+rnd(-S.storm.r,S.storm.r)*0.8, y:CENTER.y+rnd(-S.storm.r,S.storm.r)*0.8}; b.wpT = rnd(4,9); } }
    const a = Math.atan2(b.wp.y-b.y, b.wp.x-b.x); mx = Math.cos(a); my = Math.sin(a);
    b.angle = a; b.cur = bestSlot(b);
    // harvest trees in the way
    if (b.wood < 40) for (const t of S.trees){ if (Math.hypot(t.x-b.x,t.y-b.y) < 70){ b.angle = Math.atan2(t.y-b.y,t.x-b.x); const c=b.cur; b.cur=0; fire(b); b.cur=c; break; } }
  }
  speed *= bootMul(b);
  return [mx*speed, my*speed];
}

// ---------- Local player input (used by solo/host for the host's player and by every guest for their own) ----------
function localInput(a, dt){
  const cam = camera();
  let vx = 0, vy = 0, fireNow = false;
  if (keys['w']||keys['arrowup']) vy -= 1; if (keys['s']||keys['arrowdown']) vy += 1;
  if (keys['a']||keys['arrowleft']) vx -= 1; if (keys['d']||keys['arrowright']) vx += 1;
  const l = Math.hypot(vx,vy) || 1; vx = vx/l*230; vy = vy/l*230;
  if (!touchMode){
    a.angle = Math.atan2(mouse.y/ZOOM + cam.y - a.y, mouse.x/ZOOM + cam.x - a.x);
    if (mouse.down) fireNow = true;
  } else {
    // left stick = move
    const mv = touch.move;
    if (mv){
      const m = Math.min(1, Math.hypot(mv.dx,mv.dy)/STICK_R);
      if (m > 0.12){ const g = Math.atan2(mv.dy,mv.dx); vx = Math.cos(g)*230*m; vy = Math.sin(g)*230*m; }
    }
    // right stick = aim; push past 40% to fire. Light aim assist toward nearby enemies.
    const am = touch.aim;
    if (am){
      const mag = Math.hypot(am.dx, am.dy);
      if (mag > 10){
        let ang = Math.atan2(am.dy, am.dx), assist = null, bd = 520;
        for (const o of S.actors){
          if (o === a || !o.alive || o.team === a.team) continue;
          const d = Math.hypot(o.x-a.x, o.y-a.y);
          if (d < bd){
            const t = Math.atan2(o.y-a.y, o.x-a.x);
            const df = Math.atan2(Math.sin(t-ang), Math.cos(t-ang));
            if (Math.abs(df) < 0.25){ bd = d; assist = df; }
          }
        }
        if (assist !== null) ang += assist*0.7;
        a.angle = ang;
        if (mag > STICK_R*0.4) fireNow = true;
      }
    }
  }
  return {vx, vy, fire:fireNow};
}

// ---------- Update (solo / host: the authoritative simulation) ----------
function stepParticles(dt){
  for (let i=S.particles.length-1;i>=0;i--){
    const q = S.particles[i]; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt;
    if (q.life <= 0) S.particles.splice(i,1);
  }
}

function update(dt){
  // storm
  const st = S.storm;
  st.t -= dt;
  if (st.state === 'wait'){
    if (st.t <= 0){ st.state = 'shrink'; st.t = PHASES[st.i].shrink; st.rFrom = st.r; st.rTo = PHASES[st.i].r; }
  } else {
    st.r = st.rFrom + (st.rTo - st.rFrom) * (1 - Math.max(0, st.t)/PHASES[st.i].shrink);
    if (st.t <= 0){
      st.r = st.rTo;
      if (st.i < PHASES.length-1){ st.i++; st.state = 'wait'; st.t = PHASES[st.i].wait; }
      else st.t = 9999;
    }
  }
  const stormDps = 8 + st.i*4;   // per second: roughly 12 seconds to eliminate at first, much faster in later phases

  for (const a of S.actors){
    if (!a.alive) continue;
    a.cd -= dt; a.swing -= dt;
    // bandage channel: switching items cancels it, finishing heals and uses one bandage
    if (a.heal > 0){
      const it = a.inv[a.cur], st = STACK[it];
      if (!st) a.heal = 0;
      else {
        a.heal -= dt;
        if (a.heal <= 0){
          a.heal = 0; sfx('hl', a.x, a.y);
          if (it === 'med') a.hp = 100;
          else if (it === 'shield') a.sh = Math.min(100, a.sh + SHIELD_GAIN);
          else a.hp = Math.min(100, a.hp + BANDAGE_HEAL);
          if (--a[st.key] <= 0){ a[st.key] = 0; const si = a.inv.indexOf(it); if (si >= 0) a.inv[si] = null; a.cur = 0; }   // used the last one: the slot is free again
        }
      }
    }
    let vx = 0, vy = 0;
    if (a.isPlayer && a.pid === 0){
      const inp = localInput(a, dt); vx = inp.vx*bootMul(a); vy = inp.vy*bootMul(a);
      if (inp.fire) fire(a);
    } else if (a.isPlayer){
      // remote human: they move themselves, we trust their position and just apply their aim/fire
      const g = a.in;
      if (g){ a.tx = g.x; a.ty = g.y; a.angle = g.a; if (g.f) fire(a); }
    } else [vx,vy] = botThink(a, dt);

    if (a.isPlayer && a.pid > 0){
      const k = Math.min(1, dt*20);
      a.x += (a.tx - a.x)*k; a.y += (a.ty - a.y)*k;
      a.x = Math.max(a.r, Math.min(W-a.r, a.x)); a.y = Math.max(a.r, Math.min(W-a.r, a.y));
    } else {
      if (a.heal > 0){ vx *= 0.5; vy *= 0.5; }   // slowed while healing
      a.x += vx*dt; a.y += vy*dt; collide(a);
    }
    // storm damage
    if (Math.hypot(a.x-CENTER.x, a.y-CENTER.y) > st.r){
      a.stormAcc = (a.stormAcc||0) + dt;
      if (a.stormAcc >= 0.25){ a.stormAcc -= 0.25; damage(a, stormDps*0.25, null); }   // ticks 4 times a second
    }
    // walk into a chest to open it
    for (const c of S.chests) if (!c.open && Math.hypot(c.x-a.x, c.y-a.y) < 34) openChest(c);
    // pickups
    for (let i=S.loot.length-1;i>=0;i--){
      const l = S.loot[i];
      if (Math.hypot(l.x-a.x,l.y-a.y) > 36) continue;
      if (l.ban === a.pid && a.isPlayer && performance.now() < l.until) continue;     // you just dropped this     // touching the drop's circle is enough
      let take = false;
      if (WEAP[l.type]){          // guns, bandages, medkits and shield potions all go into the loadout
        take = giveItem(a, l.type, l.rar);
      }
      else if (l.type === 'wood'){ a.wood = Math.min(999, a.wood + (l.n || 30)); take = true; }
      if (take){ S.loot.splice(i,1); sfx('pk', a.x, a.y); }
    }
  }

  // grenades in flight
  for (let i=S.grenades.length-1;i>=0;i--){
    const g = S.grenades[i]; g.t += dt;
    const pr = Math.min(1, g.t / g.dur); g.x = g.sx + (g.tx-g.sx)*pr; g.y = g.sy + (g.ty-g.sy)*pr;
    if (pr >= 1){ S.grenades.splice(i,1); explode(g); }
  }

  // bullets (teammates are never hurt by each other)
  for (let i=S.bullets.length-1;i>=0;i--){
    const b = S.bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    let dead = b.life <= 0;
    if (!dead){
      const k = wallKey(Math.floor(b.x/G), Math.floor(b.y/G));
      const w = S.walls.get(k);
      if (w){ w.hp -= b.dmg; dead = true; burst(b.x,b.y,'#c93',3); if (w.hp <= 0) S.walls.delete(k); }
    }
    if (!dead) for (const t of S.trees){ if (Math.hypot(b.x-t.x,b.y-t.y) < t.r){ dead = true; burst(b.x,b.y,'#4a4',2); break; } }
    if (!dead) for (const a of S.actors){
      if (a === b.owner || !a.alive || a.team === b.owner.team) continue;
      if (Math.hypot(b.x-a.x,b.y-a.y) < a.r){ damage(a, b.dmg, b.owner); burst(b.x,b.y,'#f44',4); dead = true; break; }
    }
    if (dead) S.bullets.splice(i,1);
  }
  stepParticles(dt);

  // end conditions: the match ends when the humans are all down, or only one team is left standing
  if (!S.over){
    const humansAlive = S.players.filter(p => p.alive).length;
    const teams = new Set(); for (const a of S.actors) if (a.alive) teams.add(a.team);
    if (humansAlive === 0){ S.over = true; S.winTeam = null; S.overAt = performance.now(); }
    else if (teams.size <= 1){ S.over = true; S.winTeam = [...teams][0] || null; S.overAt = performance.now(); }
  }
}

// ---------- Networking: host side ----------
// Star topology: every guest connects to the host. The host runs the match and streams the state back out.
const ITEM_CODE = {pickaxe:'1', pistol:'2', shotgun:'3', ar:'4', bandage:'5', med:'6', shield:'7', grenade:'8', boots:'9'}, ITEM_BY = [null,'pickaxe','pistol','shotgun','ar','bandage','med','shield','grenade','boots'];
const encInv = inv => inv.map(w => w ? ITEM_CODE[w] : '0').join('');
const decInv = str => str.split('').map(c => ITEM_BY[+c] || null);
const peerCount = () => Object.keys(NET.peers).length;
function broadcast(m){ for (const pid in NET.peers){ try { const c = NET.peers[pid].conn; if (c.open) c.send(m); } catch(_){} } }
function peerSend(pid, m){
  if (pid === 0){ onLobbyMsg(m); return; }     // the host's own screen
  const p = NET.peers[pid]; try { if (p && p.conn.open) p.conn.send(m); } catch(_){}
}
function encodeActor(a){
  return [Math.round(a.x), Math.round(a.y), +a.angle.toFixed(2), Math.round(a.hp), Math.round(a.sh), a.wood, a.band,
          +Math.max(0,a.heal).toFixed(2), a.cur, a.alive?1:0, a.kills, a.swing>0?1:0, a.place||0, encInv(a.inv), a.isPlayer?1:0, '' + a.gr.pistol + a.gr.shotgun + a.gr.ar, a.med, a.shd];
}
function sendSnapshot(){
  if (!peerCount()) return;
  const st = S.storm;
  const msg = {t:'snap', st:{i:st.i, s:st.state === 'wait' ? 0 : 1, t:+st.t.toFixed(2), r:Math.round(st.r)},
    A:S.actors.map(encodeActor),
    B:S.bullets.map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy), b.color]),
    ev:S.ev, sn:S.sn || [], G:S.grenades.map(g => [Math.round(g.x), Math.round(g.y), +(g.t/g.dur).toFixed(2)]), bm:S.bm || [], o:S.over?1:0, wt:S.winTeam};
  S.ev = []; S.sn = []; S.bm = [];
  // slow-changing world data is only sent when it actually changed
  const Wl = S.walls.size ? [...S.walls.values()].map(w => [w.gx, w.gy, Math.round(w.hp)]) : [];
  const Ws = JSON.stringify(Wl);               if (Ws !== NET.last.W){ NET.last.W = Ws; msg.W = Wl; }
  const Ll = S.loot.map(l => [Math.round(l.x), Math.round(l.y), TYPES.indexOf(l.type), l.n || 0, l.rar || 0]);
  const Ls = JSON.stringify(Ll);               if (Ls !== NET.last.L){ NET.last.L = Ls; msg.L = Ll; }
  const Cl = S.chests.map(c => c.open ? 1 : 0);
  const Cs = Cl.join('');                      if (Cs !== NET.last.C){ NET.last.C = Cs; msg.C = Cl; }
  const Tl = new Array(TREE_COUNT).fill(0); for (const t of S.trees) Tl[t.id] = t.wood;
  const Ts = Tl.join(',');                     if (Ts !== NET.last.T){ NET.last.T = Ts; msg.T = Tl; }
  broadcast(msg);
}
function sendInit(){
  const base = {t:'init',
    trees:S.trees.map(t => [t.x, t.y]), chests:S.chests.map(c => [c.x, c.y]),
    actors:S.actors.map(a => ({n:a.name, c:a.color, tm:a.team, h:a.isPlayer?1:0, pid:a.pid, x:Math.round(a.x), y:Math.round(a.y)}))};
  for (const pid in NET.peers){
    const me = S.actors.findIndex(a => a.isPlayer && a.pid === +pid);
    try { NET.peers[pid].conn.send(Object.assign({me}, base)); } catch(_){}
  }
  NET.last = {W:'',L:'',C:'',T:''};
}
const currentHumans = () => NET.lobby.map(p => ({pid:p.pid, name:p.name, mate:p.mate}));
function hostBeginMatch(){
  if (NET.role !== 'host' || phase !== 'lobby') return;
  init(currentHumans());
  sendInit();
  phase = 'play'; hideMenu(); NET.snapAcc = 0;
}
// Wins are kept per hosted room: the host counts them and the lobby shows them. A new room starts everyone at 0.
function creditWins(){
  if (S.winTeam === null) return;
  for (const p of S.players){
    const e = lp(p.pid);
    if (e && p.team === S.winTeam) e.wins = (e.wins || 0) + 1;
  }
}
// After a hosted match everyone returns to the lobby (teams are kept, so the host can just start again).
function hostToLobby(){
  phase = 'lobby'; NET.invites = []; NET.incoming = []; NET.sent = new Set();
  broadcast({t:'tolobby'});
  showLobbyScreen();
  lobbyBroadcast();
}
function showLobbyScreen(){
  $('menu').classList.remove('hide'); $('exit').style.display = 'none'; showScreen('s-lobby');
}
function hostRestart(){
  if (NET.role === 'host') hostToLobby();
  else init();
}
function onHostData(pid, m){
  if (!m) return;
  if (phase === 'lobby'){ lobbyAction(pid, m); return; }
  if (phase !== 'play') return;
  const g = S.players.find(p => p.pid === pid);
  if (!g) return;
  switch (m.t){
    case 'in':      g.in = m; break;
    case 'build':   build(g); break;
    case 'sel':     if (m.i >= 0 && m.i < 6 && g.inv[m.i]) g.cur = m.i; break;
    case 'heal':    startHeal(g); break;
    case 'drop':    dropItem(g); break;
    case 'throw':   throwGrenade(g, +m.x, +m.y); break;
    case 'restart': if (S.over && performance.now() - S.overAt > 700) hostRestart(); break;
  }
}
// ----- name filter: keeps names kid-friendly. The host re-checks every name, so a modified client can't get around it. -----
const BAD_PART = ['fuck','shit','bitch','cunt','nigg','fagg','whore','slut','rape','rapist','penis','vagina','pussy','bastard',
  'asshole','dildo','porn','nazi','hitler','molest','pedo','wank','jizz','blowjob','handjob','retard','tranny','dyke','kkk',
  'cocksuck','sex','motherf','bullshit','titties','boner','erotic','orgasm','genital','masturbat','vulva','rectum','scrotum'];
const BAD_WORD = ['ass','arse','tit','tits','cock','dick','dik','cum','sex','sexy','anus','fag','damn','hell','crap','piss',
  'boob','boobs','butt','nude','naked','nazi','coon','spic','kike','chink','gook','paki','homo','pimp','hoe','thot','balls','nuts','poop','fart'];
const LEET = {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','9':'g','@':'a','$':'s','!':'i','+':'t','|':'i','(':'c'};
const looseRe = w => w.split('').map(c => c + '+').join('');         // "fuuuck" still matches "fuck"
const BAD_PART_RE = new RegExp(BAD_PART.map(looseRe).join('|'));
const BAD_WORD_RE = new RegExp('^(' + BAD_WORD.map(looseRe).join('|') + ')$');
function isBadName(name){
  const norm = String(name).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[0-9@$!+|(]/g, c => LEET[c] || c);
  const squashed = norm.replace(/[^a-z]/g, '').replace(/scunthorpe|essex|sussex|middlesex|wessex/g, '');   // innocent words that contain a blocked part
  if (BAD_PART_RE.test(squashed)) return true;
  // short words only count as whole words, so "Class" or "Hello" are fine
  return norm.split(/[^a-z]+/).some(t => t && BAD_WORD_RE.test(t));
}
function cleanName(n){
  const name = String(n == null ? '' : n).replace(/[\u0000-\u001f<>&"`]/g, '').trim().slice(0, 12);
  return isBadName(name) ? '' : name;
}
const rawName = () => String($('pname').value).replace(/[\u0000-\u001f<>&"`]/g, '').trim().slice(0, 12);
// blocks the menu action when the typed name isn't allowed
function nameAllowed(){
  if (rawName() && !cleanName(rawName())){ menuMsg('That name isn\'t allowed. Please pick a different one.'); $('pname').focus(); return false; }
  return true;
}
function uniqueName(name){
  let n = name, i = 2;
  while (NET.lobby.some(p => p.name.toLowerCase() === n.toLowerCase())) n = name.slice(0, 10) + ' ' + (i++);
  return n;
}
function hostAcceptConnection(conn){
  let pid = null;
  const reject = why => { try { conn.send({t:'rejected', why}); } catch(_){} setTimeout(() => { try { conn.close(); } catch(_){} }, 400); };
  conn.on('data', m => {
    if (pid !== null){ onHostData(pid, m); return; }
    if (!m || m.t !== 'hello') return;
    if (phase !== 'lobby') return reject('That match has already started.');
    if (NET.lobby.length >= MAX_PLAYERS) return reject('That room is full.');
    pid = NET.nextPid++;
    const name = uniqueName(cleanName(m.name) || 'Player ' + (pid+1));
    NET.peers[pid] = {conn, name};
    NET.lobby.push({pid, name, mate:null, wins:0});   // wins only count inside this room
    try { conn.send({t:'welcome', pid, name}); } catch(_){}
    lobbyBroadcast();
    toast(name + ' joined'); playSnd('ui');
  });
  const closed = () => { if (pid !== null && NET.peers[pid]) onPeerLeft(pid); };
  conn.on('close', closed);
  conn.on('error', closed);
}
function onPeerLeft(pid){
  const peer = NET.peers[pid]; if (!peer) return;
  delete NET.peers[pid];
  const name = peer.name;
  lobbyRemove(pid);
  if (phase === 'lobby'){ lobbyBroadcast(); toast(name + ' left the room'); return; }
  const g = S && S.players.find(p => p.pid === pid);
  if (g){            // a bot takes over (as a teammate if they were in a duo, otherwise on their own)
    g.isPlayer = false; g.pid = -1; g.name = name + ' (bot)'; g.in = null;
    S.players = S.players.filter(p => p !== g);
  }
  toast(name + ' disconnected. A bot took their place.');
}

// ----- lobby: who is in the room and who is teamed with whom (the host's copy is the truth) -----
const lp = id => NET.lobby.find(p => p.pid === id);
function lobbyBroadcast(){
  const players = NET.lobby.map(p => ({pid:p.pid, name:p.name, mate:p.mate, wins:p.wins || 0}));
  broadcast({t:'lobby', players});
  onLobbyMsg({t:'lobby', players});
}
function clearInvites(pid){
  NET.invites = NET.invites.filter(iv => {
    if (iv.from !== pid && iv.to !== pid) return true;
    if (iv.to !== pid) peerSend(iv.to, {t:'invitegone', from:iv.from});   // their banner goes away
    return false;
  });
}
function lobbyRemove(pid){
  clearInvites(pid);
  NET.lobby = NET.lobby.filter(p => p.pid !== pid);
  for (const p of NET.lobby) if (p.mate === pid) p.mate = null;
}
function lobbyAction(pid, m){
  const me = lp(pid); if (!me || !m) return;
  if (m.t === 'invite'){
    const to = lp(m.to);
    if (!to || to.pid === pid || me.mate != null || to.mate != null) return;
    if (NET.invites.some(iv => iv.from === pid && iv.to === to.pid)) return;
    NET.invites.push({from:pid, to:to.pid});
    peerSend(to.pid, {t:'invited', from:pid, name:me.name});
  } else if (m.t === 'accept'){
    const from = lp(m.from);
    if (!from || me.mate != null || from.mate != null) return;
    if (!NET.invites.some(iv => iv.from === m.from && iv.to === pid)) return;
    me.mate = from.pid; from.mate = pid;
    clearInvites(pid); clearInvites(from.pid);
    lobbyBroadcast();
  } else if (m.t === 'decline'){
    const i = NET.invites.findIndex(iv => iv.from === m.from && iv.to === pid);
    if (i >= 0){ NET.invites.splice(i, 1); peerSend(m.from, {t:'declined', by:pid, name:me.name}); }
  } else if (m.t === 'leaveteam'){
    if (me.mate != null){ const mate = lp(me.mate); me.mate = null; if (mate) mate.mate = null; lobbyBroadcast(); }
  }
}
function sendLobbyMsg(m){ if (NET.role === 'host') lobbyAction(0, m); else netSend(m); }
// what the lobby screen does with a message (the host calls this for its own screen too)
function onLobbyMsg(m){
  if (m.t === 'lobby'){
    NET.view = m.players;
    const me = m.players.find(p => p.pid === NET.myPid);
    if (me && me.mate != null){ NET.incoming = []; NET.sent.clear(); }   // teamed up: pending invites no longer apply
    renderLobby();
  }
  else if (m.t === 'invited'){
    if (!NET.incoming.some(x => x.from === m.from)) NET.incoming.push({from:m.from, name:m.name});
    renderLobby(); toast(m.name + ' wants to team up'); playSnd('ui');
  } else if (m.t === 'invitegone'){ NET.incoming = NET.incoming.filter(x => x.from !== m.from); renderLobby(); }
  else if (m.t === 'declined'){ NET.sent.delete(m.by); toast(m.name + ' declined'); renderLobby(); }
}

function buildGuestState(m){

    isPlayer:!!d.h, pid:d.pid, team:d.tm, name:d.n, color:d.c, seen:false}));

function applySnap(m){

  const now = performance.now();

    const d = A[i], a = S.actors[i];
    if (a === S.player){
      if (Math.hypot(d[0]-a.x, d[1]-a.y) > 250){ a.x = d[0]; a.y = d[1]; }          // far off: snap (new match, etc.)
      if (d[3] < a.hp && touchMode && navigator.vibrate) navigator.vibrate(d[3] <= 0 ? 200 : 20);
      if (now > (a.selHold || 0)) a.cur = d[8];
    } else {
      a.tx = d[0]; a.ty = d[1]; a.tang = d[2];
      if (!a.seen){ a.x = d[0]; a.y = d[1]; a.angle = d[2]; a.seen = true; }
      if (a.isPlayer && !d[14]){ a.isPlayer = false; a.name = a.name + ' (bot)'; }   // a player dropped out; a bot has their place
    }

      }
      a.gr = ng; a._pg = Object.assign({}, ng); a._pi = a.inv.slice();
    }
  }
  S.bullets = m.B.map(b => ({x:b[0], y:b[1], vx:b[2], vy:b[3], color:b[4]}));
  S.grenades = (m.G || []).map(g => ({x:g[0], y:g[1], p:g[2]}));
  if (m.bm) for (const q of m.bm) S.blasts.push({x:q[0], y:q[1], t0:performance.now()});
  const st = S.storm; st.i = m.st.i; st.state = m.st.s ? 'shrink' : 'wait'; st.t = m.st.t; st.r = m.st.r;
  if (m.W) S.walls = new Map(m.W.map(([gx,gy,hp]) => [wallKey(gx,gy), {gx, gy, hp}]));

  if (m.T){ m.T.forEach((w,id) => { S.allTrees[id].wood = w; }); S.trees = S.allTrees.filter(t => t.wood > 0); }
  for (const e of m.ev) burst(e[0], e[1], e[2], e[3]);
  if (m.sn) for (const q of m.sn) playSnd(q[0], q[1], q[2]);

function onGuestData(m){
  if (!m) return;
  switch (m.t){
    case 'welcome':
      NET.myPid = m.pid; NET.role = 'guest'; if (NET.joinOk) NET.joinOk();
      phase = 'lobby'; $('roomcode').textContent = NET.code; showScreen('s-lobby');
      break;
    case 'lobby': case 'invited': case 'invitegone': case 'declined':
      if (phase === 'lobby') onLobbyMsg(m);
      break;
    case 'rejected':
      if (NET.joinFail) NET.joinFail(m.why || 'Could not join that room.');
      break;
    case 'tolobby':
      phase = 'lobby'; NET.incoming = []; NET.sent = new Set(); showLobbyScreen();
      break;
    case 'init':
      buildGuestState(m); phase = 'play'; hideMenu(); NET.lastSnap = performance.now(); NET.lost = false;
      for (const k of ['move','aim']) touch[k] = null;

function onHostLeft(){

}
function guestAttach(conn, name){
  NET.conn = conn; NET.left = false;

  conn.on('close', onHostLeft);
  conn.on('error', onHostLeft);
  const hello = () => { try { conn.send({t:'hello', name:cleanName(name)}); } catch(_){} };
  if (conn.open) hello(); else conn.on('open', hello);

// Guest simulation step: move myself locally, send my controls, smooth everyone else.
function updateGuest(dt){
  const me = S.player, st = S.storm;
  if (me.alive){
    const inp = localInput(me, dt);
    let vx = inp.vx*bootMul(me), vy = inp.vy*bootMul(me);
    if (me.heal > 0){ vx *= 0.5; vy *= 0.5; }
    me.x += vx*dt; me.y += vy*dt; collide(me);
    NET.inAcc += dt;
    if (NET.inAcc >= 1/30){ NET.inAcc = 0; netSend({t:'in', x:Math.round(me.x), y:Math.round(me.y), a:+me.angle.toFixed(3), f:inp.fire?1:0}); }
  }
  const k = Math.min(1, dt*14);
  for (const a of S.actors){
    if (a.heal > 0) a.heal -= dt;
    a.swing -= dt;
    if (a === me) continue;
    a.x += (a.tx - a.x)*k; a.y += (a.ty - a.y)*k;
    if (a.tang !== undefined) a.angle += Math.atan2(Math.sin(a.tang-a.angle), Math.cos(a.tang-a.angle))*k;
  }
  for (const b of S.bullets){ b.x += b.vx*dt; b.y += b.vy*dt; }
  st.t -= dt;
  stepParticles(dt);
  if (!NET.lost && performance.now() - NET.lastSnap > 5000){ NET.lost = true; toast('Connection lost… waiting for the host', 5000); }
}

// Whose view we show: ourselves, or (once eliminated) a teammate, then any other human, so we can spectate.
function viewTarget(){
  const me = S.player;

  return S.actors.find(a => a.isPlayer && a.alive && a.team === me.team)
      || S.actors.find(a => a.isPlayer && a.alive) || me;
}
function camera(){
  const p = viewTarget();
  return {x: Math.max(0, Math.min(W-VW, p.x - VW/2)), y: Math.max(0, Math.min(W-VH, p.y - VH/2))};
}
const LOOT_COL = {pistol:'#9cf', shotgun:'#fa5', ar:'#9f6', shield:'#58f', med:'#f55', wood:'#a73', bandage:'#fff'};
// ---------- Tree pictures (pre-drawn once into small sprites so drawing 100s of trees stays fast) ----------
// The canopy fills the same 22-unit circle trees always had, so the cover they give from bullets is unchanged.
const TREE_VARIANTS = 6, TREE_SPRITE = {};
function makeTree(variant, chopped){
  const S2 = 2, size = 64, c = document.createElement('canvas'); c.width = c.height = size * S2;
  const g = c.getContext('2d'); g.scale(S2, S2); g.translate(size/2, size/2);
  let seed = 1234 + variant * 7919; const rnd2 = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const pal = chopped ? {dark:'#2a6a35', mid:'#378443', light:'#4c9c55', hi:'#6cb872', line:'#12401b'}
                      : {dark:'#16692a', mid:'#238a37', light:'#35a847', hi:'#62cf6c', line:'#0b3a14'};
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(3, 5, 23, 21, 0, 0, 7); g.fill();       // ground shadow
  const lobes = 7 + (variant % 2), base = rnd2() * 6.28, lobe = [];
  for (let i = 0; i < lobes; i++){ const a = base + i * 6.28318 / lobes + (rnd2()-0.5)*0.25; lobe.push([Math.cos(a)*(12.5+rnd2()*1.5), Math.sin(a)*(12.5+rnd2()*1.5), 8.6 + rnd2()*1.2]); }
  g.lineWidth = 2; g.strokeStyle = pal.line;
  g.fillStyle = pal.dark; g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fill();
  for (const [x,y,r] of lobe){ g.fillStyle = pal.dark; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = pal.dark; g.beginPath(); g.arc(0, 0, 17, 0, 7); g.fill();                              // hide the seams between lobes
  for (const [x,y,r] of lobe){ g.fillStyle = pal.mid; g.beginPath(); g.arc(x*0.92-1.5, y*0.92-1.8, r*0.72, 0, 7); g.fill(); }
  g.fillStyle = pal.light; g.beginPath(); g.arc(-3, -3.5, 11, 0, 7); g.fill();
  for (let i = 0; i < 5; i++){ g.fillStyle = pal.hi; g.beginPath(); g.arc(-9 + rnd2()*14, -10 + rnd2()*12, 1.6 + rnd2()*2, 0, 7); g.fill(); }   // sunlit leaf clusters
  g.fillStyle = 'rgba(0,0,0,0.18)'; g.beginPath(); g.arc(5, 6, 8, 0, 7); g.fill();                    // soft shade on the far side
  if (chopped){ g.fillStyle = '#7a5530'; g.beginPath(); g.arc(0, 0, 3.4, 0, 7); g.fill(); g.strokeStyle = '#3a2410'; g.lineWidth = 1.2; g.stroke(); }   // trunk shows through a thinned canopy
  else { g.fillStyle = '#5a3a1a'; g.beginPath(); g.arc(0.5, 0.5, 2.2, 0, 7); g.fill(); }
  return c;
}
function treeSprite(t){
  const k = (t.id % TREE_VARIANTS) + (t.wood < 100 ? 'c' : '');
  return TREE_SPRITE[k] || (TREE_SPRITE[k] = makeTree(t.id % TREE_VARIANTS, t.wood < 100));
}

// ---------- Gun drawing: side-view silhouettes pointing along +x (origin at the grip), used for loot, held weapons and the slots ----------
const GUN_W  = {pistol:24, shotgun:56, ar:52};     // overall length in drawing units
const GUN_CX = {pistol:11, shotgun:14, ar:13};     // centre of that length (for centring icons)
function drawGun(c, type, s, accent){
  c.save(); c.scale(s, s); c.lineWidth = 1.6/s; c.strokeStyle = '#000'; c.lineJoin = 'round';
  const poly = (pts, fill) => { c.fillStyle = fill; c.beginPath(); c.moveTo(pts[0], pts[1]);
    for (let i=2;i<pts.length;i+=2) c.lineTo(pts[i], pts[i+1]); c.closePath(); c.fill(); c.stroke(); };
  const box = (x, y, w, h, fill) => poly([x,y, x+w,y, x+w,y+h, x,y+h], fill);
  if (type === 'pistol'){
    poly([3,0, 13,0, 11,11, 3,11], '#3b3b3b');          // grip
    box(0,-6, 21,6, '#aab4bd');                         // slide

    box(11,0, 5,1.5, '#222');                           // trigger guard

    poly([-14,-3, 2,-4, 2,3, -11,6], '#8a5a2b');        // wooden stock

    box(15,-4, 27,2.6, '#2b2b2b');                      // long barrel
    box(15,-1.4, 27,2.2, '#777');                       // magazine tube
    box(18,0.8, 13,4, '#8a5a2b');                       // pump grip
    box(41,-6, 2,2.6, '#222');                          // front sight

    if (accent){ c.fillStyle = accent; c.fillRect(4,-3, 9,1.6); }
  } else if (type === 'ar'){
    poly([-12,-2, 0,-4, 0,3, -10,5], '#333');           // stock
    box(0,-5, 17,7, '#444');                            // receiver
    box(17,-4, 10,5, '#666');                           // handguard
    box(27,-2.6, 13,2.4, '#222');                       // barrel
    box(39,-4, 2,3, '#222');                            // muzzle brake
    box(5,-8, 10,3, '#222');                            // scope / rail sight
    poly([8,2, 14,2, 15,11, 9,12], '#222');             // magazine

    if (accent){ c.fillStyle = accent; c.fillRect(2,-3, 12,1.6); }

}
