  } else if (type === 'grenade'){     // fragmentation grenade
    c.fillStyle = '#4f6f2e'; c.beginPath(); c.ellipse(0,3, 9.5,11.5, 0, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = '#2c4318'; c.lineWidth = 1/s;
    c.beginPath(); c.moveTo(-9,3); c.lineTo(9,3); c.moveTo(-6,-4); c.lineTo(6,-4); c.moveTo(-6,10); c.lineTo(6,10); c.moveTo(0,-8); c.lineTo(0,14); c.moveTo(-5,-7); c.lineTo(-5,13); c.moveTo(5,-7); c.lineTo(5,13); c.stroke();
    c.strokeStyle = '#000'; c.lineWidth = 1.6/s;
    c.fillStyle = '#8b939a'; c.fillRect(-3.5,-11, 7,5); c.strokeRect(-3.5,-11, 7,5);                       // fuse head
    c.fillStyle = '#b7bec4'; c.beginPath(); c.moveTo(3,-10); c.quadraticCurveTo(13,-9, 11,4); c.lineTo(8,3); c.quadraticCurveTo(9,-5, 3,-7); c.closePath(); c.fill(); c.stroke();   // lever
    c.strokeStyle = '#e6b800'; c.lineWidth = 2/s; c.beginPath(); c.arc(-6.5,-10, 3.2, 0, 7); c.stroke();    // pin ring
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.ellipse(-4,0, 2,4, 0.2, 0, 7); c.fill();
  } else if (type === 'boots'){       // winged speed boot
    c.fillStyle = '#e8a317'; c.beginPath(); c.moveTo(-6,-11); c.lineTo(6,-11); c.lineTo(6,1); c.quadraticCurveTo(15,3,15,10); c.lineTo(15,13); c.lineTo(-7,13); c.lineTo(-7,-1); c.closePath(); c.fill(); c.stroke();
    rr(-8,10, 24,4, 1.5, '#5a3a10');                                                                      // sole
    rr(-8,-14, 15,5, 2, '#fff');                                                                          // cuff
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-8,-3); c.quadraticCurveTo(-15,-14,-21,-12); c.quadraticCurveTo(-17,-8,-19,-5); c.quadraticCurveTo(-14,-5,-15,0); c.quadraticCurveTo(-11,0,-12,4); c.closePath(); c.fill(); c.stroke();   // wing
    c.fillStyle = '#fff23a'; c.beginPath(); c.moveTo(1,-6); c.lineTo(5,-6); c.lineTo(2.5,-1); c.lineTo(6,-1); c.lineTo(-1,8); c.lineTo(0.5,1); c.lineTo(-3,1); c.closePath(); c.fill(); c.stroke();   // lightning bolt
  } else if (type === 'med'){         // first-aid kit
    rr(-6,-14, 12,6, 2, '#888');                                                                          // handle
    rr(-14,-10, 28,22, 4, '#e8362f');
    c.fillStyle = '#fff'; c.fillRect(-2.6,-6, 5.2,14); c.fillRect(-7.4,-1.6, 14.8,5.2);
  } else if (type === 'wood'){        // bundle of logs tied with rope
    for (const [y,off] of [[-8.5,0],[0,0],[8.5,0]]){
      rr(-14+off, y-4, 28, 8, 4, '#a5692c');
      c.fillStyle = '#e0b070'; c.beginPath(); c.ellipse(14+off, y, 2.4, 4, 0, 0, 7); c.fill(); c.stroke();
      c.strokeStyle = '#6a4318'; c.lineWidth = 0.9/s; c.beginPath(); c.moveTo(-10+off, y-1); c.lineTo(8+off, y-1); c.stroke();
      c.strokeStyle = '#000'; c.lineWidth = 1.6/s;
    }
    c.fillStyle = '#d6b36a'; c.fillRect(-4,-13, 3.4, 26); c.strokeRect(-4,-13, 3.4, 26);                    // rope
    c.fillStyle = '#d6b36a'; c.fillRect(6,-13, 3.4, 26); c.strokeRect(6,-13, 3.4, 26);
  }
  c.restore();
}
const ITEM_RING = '#46606e';     // non-gun drops get a neutral ring; guns get the colour of their rarity

const LOOT_LBL = {pistol:'P', shotgun:'S', ar:'R', shield:'+', med:'♥', wood:'W', bandage:'B'};

function draw(){
  const cam = camera(), p = S.player, vw = VW, vh = VH;
  ctx.setTransform(DPR*ZOOM, 0, 0, DPR*ZOOM, 0, 0);
  ctx.fillStyle = '#4c8c4a'; ctx.fillRect(0,0,vw,vh);
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  // grid
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(cam.x/G)*G; x < cam.x+vw; x += G){ ctx.moveTo(x,cam.y); ctx.lineTo(x,cam.y+vh); }
  for (let y = Math.floor(cam.y/G)*G; y < cam.y+vh; y += G){ ctx.moveTo(cam.x,y); ctx.lineTo(cam.x+vw,y); }
  ctx.stroke();
  // map edge
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(0,0,W,W);
  const vis = (x,y,m=60) => x>cam.x-m && x<cam.x+vw+m && y>cam.y-m && y<cam.y+vh+m;
  // chests
  for (const c of S.chests){ if (!vis(c.x,c.y)) continue;
    ctx.save(); ctx.translate(c.x,c.y); ctx.lineWidth=2; ctx.strokeStyle='#000';
    if (!c.open){
      ctx.fillStyle='rgba(255,210,60,0.25)'; ctx.beginPath(); ctx.arc(0,0,30,0,7); ctx.fill();
      ctx.fillStyle='#d9a22b'; ctx.fillRect(-16,-11,32,22);
      ctx.fillStyle='#b9801a'; ctx.fillRect(-16,-11,32,9);
      ctx.strokeRect(-16,-11,32,22);
      ctx.beginPath(); ctx.moveTo(-16,-2); ctx.lineTo(16,-2); ctx.stroke();
      ctx.fillStyle='#fff6c0'; ctx.fillRect(-3,-5,6,7);
    } else {
      ctx.fillStyle='#6b4a1a'; ctx.fillRect(-16,-4,32,15);
      ctx.fillStyle='#2a1c08'; ctx.fillRect(-13,-2,26,8);
      ctx.fillStyle='#8a6422'; ctx.fillRect(-16,-16,32,8);
      ctx.strokeRect(-16,-4,32,15); ctx.strokeRect(-16,-16,32,8);
    }
    ctx.restore(); }
  // loot
  for (const l of S.loot){ if (!vis(l.x,l.y)) continue;
    // every drop lies on a white plate with a coloured ring so it stands out on the grass
    const ring = GUN_W[l.type] ? RARITY[l.rar || 0].col : l.type === 'grenade' ? RARITY[4].col : l.type === 'boots' ? RARITY[BOOT_RAR].col : ITEM_RING;
    ctx.fillStyle = '#fffffff0'; ctx.beginPath(); ctx.arc(l.x, l.y, 19, 0, 7); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.stroke();                         // dark edge so every ring shows up on the grass
    ctx.strokeStyle = ring; ctx.lineWidth = 3.5; ctx.stroke();
    if (l.rar === 4 || l.type === 'grenade' || l.type === 'boots'){ ctx.strokeStyle = '#fff6'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(l.x, l.y, 24 + Math.sin(performance.now()/250)*2, 0, 7); ctx.stroke(); }   // gold guns shimmer
    ctx.save(); ctx.translate(l.x, l.y);
    if (GUN_W[l.type]){
      ctx.rotate(-0.35); const gs = 28 / GUN_W[l.type]; ctx.translate(-GUN_CX[l.type]*gs, 0); drawGun(ctx, l.type, gs, RARITY[l.rar || 0].col);
    } else drawItem(ctx, l.type, 0.85);
    ctx.restore(); }
  // walls
  for (const w of S.walls.values()){ const x=w.gx*G, y=w.gy*G; if (!vis(x,y)) continue;
    ctx.fillStyle = `rgb(${120+w.hp/3|0},${90+w.hp/4|0},60)`; ctx.fillRect(x,y,G,G);
    ctx.strokeStyle='#432'; ctx.lineWidth=3; ctx.strokeRect(x+1,y+1,G-2,G-2); }
  // trees
  for (const t of S.trees){ if (!vis(t.x,t.y,40)) continue;
    ctx.drawImage(treeSprite(t), t.x-32, t.y-32, 64, 64); }
  // bullets
  for (const b of S.bullets){ ctx.strokeStyle=b.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*0.025, b.y-b.vy*0.025); ctx.stroke(); }
  // actors
  for (const a of S.actors){ if (!a.alive || !vis(a.x,a.y)) continue;
    if (a.inv.includes('boots')){ ctx.fillStyle = 'rgba(255,230,60,0.28)'; ctx.beginPath(); ctx.arc(a.x,a.y,a.r+6+Math.sin(performance.now()/120)*1.5,0,7); ctx.fill(); }   // speed-boot glow
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.angle);
    const w = WEAP[a.inv[a.cur]] || WEAP.pickaxe;
    ctx.fillStyle = w.color; ctx.strokeStyle='#000'; ctx.lineWidth=2;
    if (w.melee){ const sw = a.swing > 0 ? 0.8 : 0; ctx.save(); ctx.rotate(-0.4+sw); ctx.fillRect(10,-3,32,6); ctx.strokeRect(10,-3,32,6); ctx.restore(); }
    else if (w.heal){ ctx.fillRect(14,-5,12,10); ctx.strokeRect(14,-5,12,10); }
    else if (w.passive){}
    else if (w.grenade){ ctx.save(); ctx.translate(24,0); drawItem(ctx, 'grenade', 0.55); ctx.restore(); }
    else {
      ctx.save(); if (Math.cos(a.angle) < 0) ctx.scale(1,-1);      // keep the gun the right way up when aiming left
      ctx.translate(a.inv[a.cur] === 'pistol' ? 10 : 18, 0); drawGun(ctx, a.inv[a.cur], a.inv[a.cur] === 'pistol' ? 1 : 0.78, RARITY[a.gr[a.inv[a.cur]] || 0].col); ctx.restore();
    }
    ctx.fillStyle = a.color; ctx.beginPath(); ctx.arc(0,0,a.r,0,7); ctx.fill(); ctx.stroke();
    ctx.restore();
    // healing progress ring
    if (a.heal > 0){
      ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.beginPath();
      ctx.arc(a.x,a.y,a.r+6,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-a.heal/healTime(a))); ctx.stroke();
    }
    // bars
    ctx.fillStyle='#0008'; ctx.fillRect(a.x-18,a.y-30,36,6);
    ctx.fillStyle='#4d4'; ctx.fillRect(a.x-18,a.y-30,36*a.hp/100,3);
    ctx.fillStyle='#4af'; ctx.fillRect(a.x-18,a.y-27,36*a.sh/100,3);
    if (a !== p){ ctx.fillStyle = a.team === p.team ? '#8f8' : '#fff'; ctx.font=Math.round(11/ZOOM)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText(a.name,a.x,a.y-36); }
  }
  for (const q of S.particles){ ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3); }
  // grenade throw helper: the range you can reach, and (with a mouse) where it would land
  if (p.alive && p.inv[p.cur] === 'grenade'){
    ctx.save(); ctx.setLineDash([10,8]); ctx.strokeStyle = 'rgba(255,214,77,0.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, GR_RANGE, 0, 7); ctx.stroke();
    if (!touchMode){
      let mx = mouse.x/ZOOM + cam.x, my = mouse.y/ZOOM + cam.y; const d = Math.hypot(mx-p.x, my-p.y);
      if (d > GR_RANGE){ mx = p.x + (mx-p.x)/d*GR_RANGE; my = p.y + (my-p.y)/d*GR_RANGE; }
      ctx.strokeStyle = 'rgba(255,70,40,0.8)'; ctx.fillStyle = 'rgba(255,70,40,0.12)';
      ctx.beginPath(); ctx.arc(mx, my, GR_RADIUS, 0, 7); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(mx-10,my); ctx.lineTo(mx+10,my); ctx.moveTo(mx,my-10); ctx.lineTo(mx,my+10); ctx.stroke();
    }
    ctx.restore();
  }
  for (const g of S.grenades){                        // in flight: arcs up and down, with a shadow on the ground
    const pr = g.p !== undefined ? g.p : Math.min(1, g.t / g.dur), h = Math.sin(pr * Math.PI);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(g.x, g.y, 9 - h*2, 5 - h, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(g.x, g.y - h*46); ctx.rotate(pr * 14); drawItem(ctx, 'grenade', 0.75 + h*0.35); ctx.restore();
  }
  const nowMs = performance.now();                    // explosions
  S.blasts = S.blasts.filter(b => nowMs - b.t0 < 600);
  for (const b of S.blasts){
    const age = (nowMs - b.t0) / 600, r = GR_RADIUS * (1 - Math.pow(1 - Math.min(1, age*1.6), 3)), fade = 1 - age;
    ctx.fillStyle = `rgba(255,140,30,${0.5*fade})`; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(255,235,150,${0.8*fade})`; ctx.beginPath(); ctx.arc(b.x, b.y, r*0.55, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,80,20,${fade})`; ctx.lineWidth = 8*fade + 1; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.stroke();
  }
  // build preview
  if (p.alive){
    const gx = Math.floor((p.x+Math.cos(p.angle)*62)/G), gy = Math.floor((p.y+Math.sin(p.angle)*62)/G);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.setLineDash([5,5]); ctx.lineWidth=2; ctx.strokeRect(gx*G,gy*G,G,G); ctx.setLineDash([]);
  }
  // storm overlay (hole in the middle)
  ctx.fillStyle = 'rgba(110,40,170,0.42)';
  ctx.beginPath(); ctx.rect(cam.x-10,cam.y-10,vw+20,vh+20);
  ctx.arc(CENTER.x, CENTER.y, Math.max(1,S.storm.r), 0, Math.PI*2, true); ctx.fill('evenodd');
  ctx.strokeStyle='#c6f'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(CENTER.x,CENTER.y,Math.max(1,S.storm.r),0,7); ctx.stroke();
  ctx.restore();
  drawHUD();
}

function drawHUD(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   // HUD is in screen pixels, not world-zoomed
  const p = S.player, vw = SW, vh = SH, tm = touchMode;
  const alive = S.actors.filter(a=>a.alive).length, st = S.storm;
  ctx.textAlign = 'left';

  // health / shield / wood
  if (tm){
    ctx.fillStyle='#0009'; ctx.fillRect(10,8,158,34);
    ctx.fillStyle='#4af'; ctx.fillRect(14,11,150*p.sh/100,12);
    ctx.fillStyle='#4d4'; ctx.fillRect(14,26,150*p.hp/100,12);
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif';
    ctx.fillText('SHIELD '+(p.sh|0), 18, 21); ctx.fillText('HEALTH '+(p.hp|0), 18, 36);
    ctx.fillStyle='#fc4'; ctx.font='bold 13px sans-serif'; ctx.fillText('Wood: '+p.wood, 174, 24);
  } else {
    ctx.fillStyle='#0009'; ctx.fillRect(20,vh-70,260,50);
    ctx.fillStyle='#4af'; ctx.fillRect(26,vh-64,248*p.sh/100,16);
    ctx.fillStyle='#4d4'; ctx.fillRect(26,vh-42,248*p.hp/100,16);
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif';
    ctx.fillText('SHIELD '+(p.sh|0), 32, vh-52); ctx.fillText('HEALTH '+(p.hp|0), 32, vh-30);
    ctx.fillStyle='#fc4'; ctx.font='bold 16px sans-serif'; ctx.fillText('Wood: '+p.wood, 20, vh-80);
  }

  // weapon slots (tappable on touch)
  for (let i=0;i<6;i++){
    const r = slotRect(i), id = p.inv[i];
    ctx.fillStyle = i===p.cur ? '#fc4' : '#0009'; ctx.fillRect(r.x,r.y,r.w,r.h);
    if (id && (GUN_W[id] || id === 'grenade' || id === 'boots')){        // the whole slot is tinted with the gun's rarity colour (grenades are always gold)
      ctx.globalAlpha = i===p.cur ? 0.55 : 0.4; ctx.fillStyle = RARITY[GUN_W[id] ? (p.gr[id] || 0) : id === 'boots' ? BOOT_RAR : 4].col; ctx.fillRect(r.x,r.y,r.w,r.h); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.fillStyle = i===p.cur ? '#000' : '#fff'; ctx.font='10px sans-serif'; ctx.textAlign='left'; ctx.fillText(i+1, r.x+4, r.y+11);
    ctx.textAlign='center'; ctx.font = tm ? 'bold 9px sans-serif' : 'bold 11px sans-serif';
    if (id && GUN_W[id]){        // guns show their picture (plus the name on desktop)
      const gs = Math.min(1.1, (r.w - 10) / GUN_W[id]);
      ctx.save(); ctx.translate(r.x + r.w/2 - GUN_CX[id]*gs, r.y + r.h*(tm ? 0.55 : 0.42)); drawGun(ctx, id, gs, RARITY[p.gr[id] || 0].col); ctx.restore();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeRect(r.x+3, r.y+3, r.w-6, r.h-6);
      ctx.strokeStyle = RARITY[p.gr[id] || 0].col; ctx.lineWidth = 3; ctx.strokeRect(r.x+3, r.y+3, r.w-6, r.h-6);   // slot border = rarity
      if (!tm){ ctx.fillStyle = i===p.cur ? '#000' : '#fff'; ctx.fillText(WEAP[id].name, r.x+r.w/2, r.y+r.h*0.9); }
    } else if (id === 'grenade' || id === 'boots'){
      ctx.save(); ctx.translate(r.x + r.w/2, r.y + r.h*(tm ? 0.5 : 0.42)); drawItem(ctx, id, tm ? 0.65 : 0.85); ctx.restore();
      if (!tm){ ctx.fillStyle = i===p.cur ? '#000' : '#fff'; ctx.fillText(id === 'boots' ? 'Boots' : 'Grenade', r.x+r.w/2, r.y+r.h*0.9); }
      ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.strokeRect(r.x+3, r.y+3, r.w-6, r.h-6);
      ctx.strokeStyle = RARITY[id === 'boots' ? BOOT_RAR : 4].col; ctx.lineWidth = 3; ctx.strokeRect(r.x+3, r.y+3, r.w-6, r.h-6);
    } else if (STACK[id]){
      ctx.save(); ctx.translate(r.x + r.w/2, r.y + r.h*(tm ? 0.4 : 0.38)); drawItem(ctx, id, tm ? 0.6 : 0.8); ctx.restore();
      ctx.fillText('x'+p[STACK[id].key], r.x+r.w/2, r.y+r.h*(tm ? 0.88 : 0.9));
    } else ctx.fillText(id ? WEAP[id].name : '-', r.x+r.w/2, r.y+r.h*0.68);
  }

  if (!tm && canDropNow()){ ctx.fillStyle = '#fffc'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('G or right-click slot: drop item', SW/2, SH-76); }

  // top-right info + minimap
  const ms = tm ? 90 : 160, mx = vw-ms-(tm?10:20), my = tm ? 8 : 100, k = ms/W;
  const fs = tm ? 12 : 18, lh = tm ? 16 : 24, tx = vw-(tm?10:20), ty = tm ? my+ms+16 : 30;
  ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='bold '+fs+'px sans-serif';
  ctx.fillText('Alive: '+alive, tx, ty); ctx.fillText('Kills: '+p.kills, tx, ty+lh);
  ctx.fillStyle='#d9f';
  ctx.fillText((st.state==='wait'?'Storm shrinks in ':'Storm closing ')+Math.max(0,st.t|0)+'s', tx, ty+lh*2);
  ctx.fillStyle='#0a3a12cc'; ctx.fillRect(mx,my,ms,ms);
  ctx.strokeStyle='#c6f'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(mx+CENTER.x*k,my+CENTER.y*k,st.r*k,0,7); ctx.stroke();
  ctx.fillStyle='#fc4';
  for (const c of S.chests){ if (c.open || Math.hypot(c.x-p.x,c.y-p.y) > 900) continue; ctx.fillRect(mx+c.x*k-2, my+c.y*k-2, 4, 4); }
  for (const a of S.actors){
    if (!a.alive) continue;
    const mine = a === p, mate = !mine && a.team === p.team;
    if (!mine && !mate && Math.hypot(a.x-p.x,a.y-p.y) > 700) continue;   // enemies only show when close
    ctx.fillStyle = mine ? '#4af' : mate ? '#6f6' : '#f66';
    ctx.beginPath(); ctx.arc(mx+a.x*k,my+a.y*k,mine?3:2,0,7); ctx.fill();
  }
  ctx.strokeStyle='#fff'; ctx.strokeRect(mx,my,ms,ms);

  if (tm){
    // build button
    const b = buildBtn();
    ctx.fillStyle = p.wood >= 10 ? 'rgba(255,200,70,0.35)' : 'rgba(150,150,150,0.25)';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText('BUILD', b.x, b.y+4);
    if (canDropNow()){ const d = dropBtn(); ctx.fillStyle = 'rgba(255,90,70,0.4)'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.fillText('DROP', d.x, d.y+4); }
    // virtual sticks (faint ghosts show where to touch)
    const drawStick = (s, gx, gy, label) => {
      const ox = s ? s.ox : gx, oy = s ? s.oy : gy;
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = s ? 0.35 : 0.15;
      ctx.beginPath(); ctx.arc(ox,oy,STICK_R,0,7); ctx.fill();
      ctx.globalAlpha = s ? 0.75 : 0.3;
      ctx.beginPath(); ctx.arc(ox+(s?s.dx:0), oy+(s?s.dy:0), 24, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      if (!s){ ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText(label, ox, oy+STICK_R+14); }
    };
    drawStick(touch.move, 95, vh-115, 'MOVE');
    drawStick(touch.aim, vw-95, vh-115, 'AIM / FIRE');
  } else {
    ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.font='12px sans-serif';
    ctx.fillText('WASD move · Mouse aim/shoot · 1-6 select slot', 20, 20);
    ctx.fillText('Hold click with a healing item or shield to use it · Q / Right-click build wall', 20, 36);
  }

  // end screen / spectating banner
  if (S.over){
    const win = S.winTeam !== null && S.winTeam === p.team;   // a co-op team win counts for both players
    ctx.fillStyle='#000a'; ctx.fillRect(0,0,vw,vh);
    ctx.textAlign='center'; ctx.fillStyle = win ? '#fc4' : '#f66'; ctx.font='bold '+Math.min(64, vw/10)+'px sans-serif';
    ctx.fillText(win ? 'VICTORY ROYALE' : 'ELIMINATED', vw/2, vh/2-20);
    ctx.fillStyle='#fff'; ctx.font=Math.min(24, vw/22)+'px sans-serif';
    ctx.fillText((win ? '#1' : '#'+p.place)+' · '+p.kills+' kills · '+(tm ? 'Tap' : 'Press R')+(NET.role === 'solo' ? ' to play again' : ' to return to the lobby'), vw/2, vh/2+30);
  } else if (!p.alive){
    ctx.fillStyle='#000a'; ctx.fillRect(vw/2-170, 44, 340, 46);
    ctx.textAlign='center'; ctx.fillStyle='#f66'; ctx.font='bold 16px sans-serif';
    ctx.fillText('ELIMINATED #'+p.place+' · '+p.kills+' kills', vw/2, 63);
    ctx.fillStyle='#fff'; ctx.font='12px sans-serif';
    ctx.fillText('Spectating · the match is still in progress', vw/2, 81);
  }
}

// ---------- Menu / lobby ----------
let toastT;
function toast(t, ms){
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', ms || 3500);
}
const SCREENS = ['s-main','s-join','s-lobby'];
function showScreen(id){ for (const s of SCREENS) $(s).hidden = (s !== id); menuMsg(''); }
function menuMsg(t){ $('msg').textContent = t || ''; }
function hideMenu(){ $('menu').classList.add('hide'); $('exit').style.display = 'block'; }

// the player's chosen name (remembered on this device)
try { $('pname').value = localStorage.getItem('sr-name') || ''; } catch(_){}
$('pname').addEventListener('input', () => { try { localStorage.setItem('sr-name', cleanName($('pname').value)); } catch(_){} });
const myName = () => cleanName($('pname').value);

function renderLobby(){
  const list = NET.view || [];
  const me = list.find(p => p.pid === NET.myPid);
  const iAmSolo = !!me && me.mate == null;
  for (const id of [...NET.sent]){ const p = list.find(x => x.pid === id); if (!p || p.mate != null) NET.sent.delete(id); }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const mkRow = p => {
    const r = el('div', 'prow' + (p.pid === NET.myPid ? ' me' : ''));
    const nm = el('span', 'nm', p.name);
    if (p.pid === NET.myPid) nm.appendChild(el('span', 'tag', '(you)'));
    if (p.pid === 0) nm.appendChild(el('span', 'tag', 'host'));
    nm.appendChild(el('span', 'tag win', '🏆 ' + (p.wins || 0)));
    r.appendChild(nm);
    if (iAmSolo && p.pid !== NET.myPid && p.mate == null){
      const b = el('button', 'mini');
      if (NET.sent.has(p.pid)){ b.textContent = 'Invited'; b.disabled = true; }
      else {
        b.textContent = 'Team up';
        b.onclick = () => { NET.sent.add(p.pid); sendLobbyMsg({t:'invite', to:p.pid}); toast('Invite sent to ' + p.name); renderLobby(); };
      }
      r.appendChild(b);
    }
    return r;
  };

  const box = $('plist'); box.textContent = '';
  const seen = new Set();
  for (const p of list){
    if (seen.has(p.pid)) continue;
    seen.add(p.pid);
    if (p.mate != null){
      const mate = list.find(x => x.pid === p.mate);
      const t = el('div', 'team'); t.appendChild(el('div', 'tl', 'Team'));
      t.appendChild(mkRow(p));
      if (mate){ seen.add(mate.pid); t.appendChild(mkRow(mate)); }
      box.appendChild(t);
    } else box.appendChild(mkRow(p));
  }

  // invitations other players have sent me
  const inv = $('invites'); inv.textContent = '';
  NET.incoming = NET.incoming.filter(x => list.some(p => p.pid === x.from && p.mate == null));
  if (iAmSolo) for (const iv of NET.incoming){
    const row = el('div', 'inv'); row.appendChild(el('span', null, iv.name + ' wants to team up'));
    const bt = el('span', 'bt');
    const ok = el('button', 'mini', 'Accept'), no = el('button', 'mini no', 'Decline');
    ok.onclick = () => { NET.incoming = NET.incoming.filter(x => x.from !== iv.from); sendLobbyMsg({t:'accept', from:iv.from}); renderLobby(); };
    no.onclick = () => { NET.incoming = NET.incoming.filter(x => x.from !== iv.from); sendLobbyMsg({t:'decline', from:iv.from}); renderLobby(); };
    bt.appendChild(ok); bt.appendChild(no); row.appendChild(bt); inv.appendChild(row);
  }

  const humans = list.map(p => ({pid:p.pid, mate:p.mate})), plan = botPlan(humans);
  const teams = new Set(humans.map(teamIdOf)).size, s = n => n === 1 ? '' : 's';
  $('lobby-info').textContent = list.length + ' player' + s(list.length) + ' in ' + teams + ' team' + s(teams) +
    '. Bots fill the rest: ' + plan.teams + ' team' + s(plan.teams) + ' of ' + plan.size + '.';
  const isHost = NET.role === 'host';
  $('b-start').hidden = !isHost;
  $('wait-host').hidden = isHost;
  $('b-leaveteam').hidden = !(me && me.mate != null);
}

// The multiplayer library is only fetched when someone actually uses it, so solo play works fully offline.
const PEER_URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
function loadPeer(ok, fail, i){
  i = i || 0;
  if (window.Peer) return ok();
  if (i >= PEER_URLS.length) return fail('Could not load the multiplayer library. Check your internet connection.');
  const s = document.createElement('script'); s.src = PEER_URLS[i];
  s.onload = ok; s.onerror = () => loadPeer(ok, fail, i+1);
  document.head.appendChild(s);
}
function genCode(){ const ch = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i=0;i<5;i++) s += ch[Math.random()*ch.length|0]; return s; }

function resetNet(){
  try { if (NET.peer) NET.peer.destroy(); } catch(_){}
  Object.assign(NET, {peer:null, conn:null, peers:{}, role:'solo', code:'', myPid:0, nextPid:1, lobby:[], view:null,
    invites:[], incoming:[], sent:new Set(), joinOk:null, joinFail:null});
  clearTimeout(NET.joinTimer);
  phase = 'menu';
}
function createRoom(tries){
  tries = tries || 0;
  const code = genCode(), peer = new Peer('stormroyale-'+code);
  NET.peer = peer;
  peer.on('open', () => {
    Object.assign(NET, {role:'host', code, myPid:0, nextPid:1, peers:{}, lobby:[{pid:0, name:myName() || 'Player 1', mate:null, wins:0}],
      invites:[], incoming:[], sent:new Set()});
    phase = 'lobby'; $('roomcode').textContent = code; showScreen('s-lobby'); lobbyBroadcast();
  });
  peer.on('connection', hostAcceptConnection);
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 5){ try { peer.destroy(); } catch(_){} createRoom(tries+1); return; }
    if (phase === 'menu'){ showScreen('s-main'); menuMsg('Could not create a room ('+err.type+'). Try again.'); }
  });
}
function joinRoom(code){
  const peer = new Peer(); NET.peer = peer; NET.code = code;
  let done = false;
  const fail = t => { if (done) return; done = true; clearTimeout(NET.joinTimer); resetNet(); showScreen('s-join'); menuMsg(t); };
  NET.joinFail = fail;
  NET.joinOk = () => { done = true; clearTimeout(NET.joinTimer); };
  NET.joinTimer = setTimeout(() => fail('Could not reach that room. Check the code, and that the host is waiting.'), 15000);
  peer.on('error', err => fail(err.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Connection error ('+err.type+').'));
  peer.on('open', () => { guestAttach(peer.connect('stormroyale-'+code, {reliable:true}), myName()); });
}

$('b-solo').onclick = () => { if (!nameAllowed()) return; NET.role = 'solo'; init(); phase = 'play'; hideMenu(); };
$('b-host').onclick = () => { if (!nameAllowed()) return; menuMsg('Connecting…'); loadPeer(() => createRoom(), menuMsg); };
$('b-join').onclick = () => { if (!nameAllowed()) return; showScreen('s-join'); $('code').focus(); };
$('b-go').onclick = () => {
  if (!nameAllowed()) return;
  const code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 5){ menuMsg('Enter the 5-character code.'); return; }
  menuMsg('Connecting…');
  loadPeer(() => joinRoom(code), menuMsg);
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-go').click(); });
$('b-start').onclick = hostBeginMatch;
$('b-leaveteam').onclick = () => sendLobbyMsg({t:'leaveteam'});
$('b-leave').onclick = () => { resetNet(); showScreen('s-main'); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => showScreen('s-main'));
$('exit').onclick = () => { if (confirm('Leave the match and return to the menu?')) location.reload(); };

// ---------- Loop ----------
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (phase === 'play'){
    if (NET.role === 'guest') updateGuest(dt);
    else {
      if (!S.over || S.actors.some(a => a.alive && !a.isPlayer)) update(dt);
      if (NET.role === 'host' && peerCount()){
        NET.snapAcc += dt;
        if (NET.snapAcc >= (peerCount() > 3 ? 1/15 : 1/20)){ NET.snapAcc = 0; sendSnapshot(); }   // 20 snapshots/s (15 with many players)
      }
    }
  }
  if (phase === 'play' && S.over && !S.sfxDone){
    S.sfxDone = true;
    if (NET.role === 'host') creditWins();
    playSnd(S.winTeam !== null && S.winTeam === S.player.team ? 'win' : 'lose');
  }
  draw();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
