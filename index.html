<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>G Royale</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{position:fixed;inset:0;width:100%}
  canvas{display:block;touch-action:none}

  /* ----- menu / lobby ----- */
  #menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(8,14,8,.80);touch-action:pan-y;overflow:auto}
  #menu.hide{display:none}
  .card{box-sizing:border-box;width:min(340px,calc(100% - 24px));max-height:calc(100% - 12px);overflow:auto;
    background:#16221a;border:2px solid #3a5a40;border-radius:14px;padding:16px 16px 12px;color:#eee;text-align:center}
  .logo{display:block;width:min(300px,100%);height:auto;margin:0 auto 8px}
  @media (max-height:520px){.logo{width:190px}}
  .card p{margin:8px 0;font-size:14px;color:#cde}
  .card .hint{font-size:12px;color:#9ab;min-height:30px}
  .card [hidden]{display:none}
  .btn{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:12px;font-size:17px;font-weight:700;
    color:#102010;background:#fc4;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation}
  .btn.ghost{background:#2a3b30;color:#cde;font-weight:600}
  .btn.sel{outline:3px solid #fff}
  .row{display:flex;gap:8px}.row .btn{margin:8px 0}
  #roomcode{font-size:38px;font-weight:800;letter-spacing:8px;color:#fc4;margin:6px 0;-webkit-user-select:text;user-select:text}
  .txt{box-sizing:border-box;width:100%;font-size:30px;text-align:center;letter-spacing:8px;text-transform:uppercase;
    padding:8px;border-radius:10px;border:2px solid #3a5a40;background:#0d1610;color:#fff;
    -webkit-user-select:text;user-select:text}
  .look{display:flex;gap:10px;align-items:center;margin:0 0 8px;text-align:left}
  .look canvas{width:56px;height:56px;flex:none;background:#2e4a33;border-radius:10px;border:1px solid #3a5a40}
  .look .lbl{margin:0 0 2px}
  .sws{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .sw{width:21px;height:21px;border-radius:50%;border:2px solid #000a;padding:0;cursor:pointer;touch-action:manipulation}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px #fc4}
  .txt.name{font-size:20px;letter-spacing:1px;text-transform:none;padding:9px;margin-bottom:6px}
  #winsbox{text-align:center;font-weight:700;color:#ffd34d;font-size:15px;margin:0 0 8px;letter-spacing:.5px}
  .ver{font-size:10px;color:#6a7;margin:2px 0 4px;opacity:.8}
  .lbl{display:block;text-align:left;font-size:12px;color:#9ab;margin:0 0 3px 2px}
  .card .small{font-size:12px;margin:2px 0;color:#9ab}
  #plist{margin:8px 0;text-align:left}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1f3326;border:1px solid #2f4a37;
    border-radius:10px;padding:6px 10px;margin:5px 0;font-size:15px;min-height:30px}
  .prow.me{border-color:#fc4}
  .prow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;color:#9ab;margin-left:6px}
  .tag.win{color:#fc4;font-weight:700}
  .team{border:2px solid #6c6;border-radius:12px;padding:3px 6px 4px;margin:6px 0;background:#17301d}
  .team .tl{font-size:11px;color:#8f8;text-transform:uppercase;letter-spacing:1px;margin:2px 4px}
  .team .prow{margin:3px 0}
  .mini{padding:6px 11px;font-size:13px;font-weight:700;border:0;border-radius:8px;background:#fc4;color:#102010;
    touch-action:manipulation;cursor:pointer;flex:none}
  .mini.no{background:#a44;color:#fff}
  .mini:disabled{opacity:.5}
  #modebox{display:flex;gap:8px;justify-content:center;margin:8px 0}
  #modebox .mini{background:#2a3a2a;color:#cfe;border:2px solid #4a6}
  #modebox .mini.sel{background:#fc4;color:#102010;border-color:#fc4}
  .mapbox{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .mapbox .mini{background:#2a3a2a;color:#cfe;border:2px solid #4a6}
  #modebox-main .mini{background:#2a3a2a;color:#cfe;border:2px solid #4a6}
  #modebox-main .mini.sel{background:#fc4;color:#102010;border-color:#fc4}
  .mapbox .mini.sel{background:#fc4;color:#102010;border-color:#fc4}
  .inv{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#3a2f10;border:1px solid #fc4;
    border-radius:10px;padding:6px 10px;margin:5px 0;font-size:14px;text-align:left}
  .inv .bt{display:flex;gap:6px;flex:none}
  #msg{min-height:18px;color:#f88;font-size:13px}
  #exit{display:none;position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:5;padding:5px 12px;font-size:12px;
    font-weight:700;color:#fff;background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #snd{position:fixed;top:6px;left:calc(50% + 46px);z-index:30;width:34px;height:30px;padding:0;font-size:16px;line-height:1;color:#fff;
    background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #mus{position:fixed;top:6px;left:calc(50% + 86px);z-index:30;width:34px;height:30px;padding:0;font-size:16px;line-height:1;color:#fff;
    background:rgba(0,0,0,.45);border:1px solid #fff6;border-radius:8px;touch-action:manipulation}
  #toast{display:none;position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;
    background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;text-align:center;max-width:90%}
</style>
</head>

        <div><div class="lbl">Shirt colour</div><div class="sws" id="shirts"></div><div class="lbl">Skin tone</div><div class="sws" id="skins"></div></div></div>

      <div class="lbl">Map</div><div class="mapbox" id="mapbox-main"></div>
      <button class="btn" id="b-solo">Play Solo</button>
      <button class="btn" id="b-host">Host a Game</button>
      <button class="btn" id="b-join">Join a Game</button>

      <p>Enter the room code</p>
      <input id="code" class="txt" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="b-go">Join</button>
      <button class="btn ghost" data-back>Back</button>

      <div class="mapbox" id="mapbox-lobby"></div>
      <p class="hint" id="lobby-info"></p>
      <button class="btn ghost" id="b-leaveteam" hidden>Leave team (play solo)</button>
      <button class="btn" id="b-start" hidden>Start Match</button>
      <p class="hint" id="wait-host" hidden>Waiting for the host to start the match…</p>
      <button class="btn ghost" id="b-leave">Leave Room</button>
    </div>

function makeLake(x, y, h, ox, oy){
  const l = {x, y, h, ox, oy, i:ISLAND_R, ix:x+ox, iy:y+oy, E:[]};
  let mx = 0;
  for (let k = 0; k < 72; k++){ const e = lakeEdge(l, k/72*Math.PI*2); l.E.push(e); if (e > mx) mx = e; }
  l.r = mx;

}
function lakeEdge(l, th){
  const h = l.h; return LAKE_R*(1 + h[0]*Math.cos(2*th+h[1]) + h[2]*Math.cos(3*th+h[3]) + h[4]*Math.cos(4*th+h[5]));

// ---------- Grenades ----------
function throwGrenade(a, tx, ty){

  dx = dx/d*reach; dy = dy/d*reach;
  a.inv[a.cur] = null; a.cur = 0;                                  // the grenade is used up
  S.grenades.push({sx:a.x, sy:a.y, x:a.x, y:a.y, tx:a.x+dx, ty:a.y+dy, t:0, dur:Math.max(0.3, reach/GR_SPEED), owner:a});
  a.angle = Math.atan2(dy, dx); sfx('th', a.x, a.y);
}
function explode(g){
  burst(g.tx, g.ty, '#fa4', 26); burst(g.tx, g.ty, '#fd5', 14);
  sfx('bm', g.tx, g.ty);
  S.blasts.push({x:g.tx, y:g.ty, t0:performance.now()});
  if (NET.role === 'host' && peerCount()) S.bm.push([Math.round(g.tx), Math.round(g.ty)]);
  for (const o of S.actors){
    if (!o.alive) continue;
    if (o !== g.owner && g.owner && o.team === g.owner.team) continue;      // teammates are never hurt (you can hurt yourself)
    const d = Math.hypot(o.x - g.tx, o.y - g.ty);
    if (d < GR_RADIUS + o.r) damage(o, GR_DMG_MAX - (GR_DMG_MAX - GR_DMG_MIN) * Math.min(1, d / GR_RADIUS), g.owner, 'grenade');
  }

    if (Math.hypot(w.gx*G + G/2 - g.tx, w.gy*G + G/2 - g.ty) < GR_RADIUS + G/2) S.walls.delete(k);
  }
}

// ---------- Inventory / healing ----------
// Slot 0 = pickaxe, slots 1-5 = loadout. Bandages stack up to MAXBAND in a single slot.
function gunToast(type, rar, upgrade, bonus){ toast((upgrade ? 'Upgraded to ' : 'Picked up ') + RARITY[rar].name + ' ' + WEAP[type].name + (bonus ? ' (+' + bonus + ' ammo)' : ''), 1800); }
function giveItem(a, type, rar){
  rar = rar || 0;
  const st = STACK[type];
  if (st){                              // bandages, medkits and shield potions stack in a single slot
    if (a[st.key] >= st.max) return false;
    let i = a.inv.indexOf(type);
    if (i < 0){ i = a.inv.indexOf(null, 1); if (i < 0) return false; a.inv[i] = type; }
    a[st.key]++; return true;
  }
  if (type === 'flame'){                // flamethrower: one, takes a slot, selected right away so you can use it
    if (a.inv.includes('flame')) return false;
    const fi = a.inv.indexOf(null, 1);
    if (fi < 0) return false;
    a.inv[fi] = 'flame'; if (a.isPlayer) a.cur = fi; if (a === S.player) toast('Flamethrower! Hold fire to burn everything ahead', 2400); return true;
  }
  if (type === 'sniper'){               // sniper rifle: players only, one, takes a slot, selected right away
    if (!a.isPlayer || a.inv.includes('sniper')) return false;
    const ni = a.inv.indexOf(null, 1);
    if (ni < 0) return false;
    a.inv[ni] = 'sniper'; a.cur = ni; a.snCd = 0; if (a === S.player) toast('Sniper Rifle! One shot, 150 damage. 5 s to reload', 2800); return true;
  }

    const bi = a.inv.indexOf(null, 1);
    if (bi < 0) return false;
    a.inv[bi] = 'boots'; if (a === S.player) toast('Speed Boots! You run 1.5x faster', 2200); return true;
  }
  if (type === 'grenade'){              // one grenade per slot
    const gi = a.inv.indexOf(null, 1);
    if (gi < 0) return false;
    a.inv[gi] = 'grenade'; if (a.isPlayer) a.cur = gi; return true;
  }
  // guns: one of each type. A better one replaces the one you hold, which drops to the ground.
  // A picked-up gun only goes into your hands if you were holding the pickaxe (nothing). A better version of the gun you already hold simply replaces it in your hands.
  const holding = a.inv[a.cur], betterThanHeld = !holding || holding === 'pickaxe';
  const have = a.inv.indexOf(type);
  if (have >= 0){
    if (rar <= a.gr[type]) return false;
    S.loot.push({x:a.x+rnd(-26,26), y:a.y+rnd(-26,26), type, rar:a.gr[type]});
    a.gr[type] = rar; if (a.isPlayer && betterThanHeld) a.cur = have;

  a.inv[i] = type; a.gr[type] = rar; if (a.isPlayer && betterThanHeld) a.cur = i;
  let bonus = 0;

  if (a === S.player) gunToast(type, rar, false, bonus);
  return true;
}
const healTime = a => (STACK[a.inv[a.cur]] || STACK.bandage).time;
function startHeal(a){
  if (!a.alive || a.down > 0 || a.heal > 0) return;
  const it = a.inv[a.cur], st = STACK[it];
  if (!st || a[st.key] <= 0) return;

}
// Drop whatever is in the selected slot (the whole stack) onto the ground in front of you to free the slot.
function dropItem(a){

// When ammo gets scarce (little on the ground in the safe zone, little carried), fresh boxes appear at random spots inside the safe zone.
function ammoCheck(){
  if (S.over) return;
  const st = S.storm, R = Math.min(st.r, st.nr) * 0.9;
  if (R < 80) return;
  const alive = S.actors.filter(a => a.alive), need = S.koth ? Math.max(5, Math.ceil(alive.length * 0.8)) : Math.max(3, Math.ceil(alive.length * 0.35));      // boxes' worth of each ammo type the map should hold
  let dropped = 0;
  for (const g of ['pistol','shotgun','ar']){
    const key = 'ammo_' + g, m = AMMO[key];
    let supply = 0;
    for (const l of S.loot) if (l.type === key && Math.hypot(l.x-st.cx, l.y-st.cy) < st.r) supply += (l.n || m.box) / m.box;
    for (const a of alive) supply += a.ammo[g] / m.box;
    for (const c of S.chests) if (!c.open && Math.hypot(c.x-st.cx, c.y-st.cy) < st.r) supply += 0.3;
    if (supply >= need) continue;
    for (let k = Math.min(S.koth ? 4 : 3, Math.ceil(need - supply)); k > 0; k--){
      let x = st.nx, y = st.ny;
      for (let tries = 0; tries < 12; tries++){
        const ang = rnd(0, Math.PI*2), r = Math.sqrt(Math.random()) * R, nearHill = S.koth && S.hill && Math.random() < 0.7, cx2 = nearHill ? S.hill.x : st.nx, cy2 = nearHill ? S.hill.y : st.ny, r2 = nearHill ? S.hill.r*rnd(0.4, 2.6) : r;      // in King of the Hill most drops land around the hill
        x = Math.round(Math.max(60, Math.min(W-60, cx2 + Math.cos(ang)*r2))); y = Math.round(Math.max(60, Math.min(W-60, cy2 + Math.sin(ang)*r2)));
        if (!nearLake(x, y, 15) && S.trees.every(t => Math.hypot(t.x-x, t.y-y) > 40) && !S.walls.has(wallKey(Math.floor(x/G), Math.floor(y/G)))) break;
      }
      S.loot.push({x, y, type:key, n:m.box}); burst(x, y, '#ffd84a', 16); dropped++;
    }
  }
  if (dropped && (!S.koth || !(S.ammoToast > performance.now() - 25000))){
    S.ammoToast = performance.now();
    toast('Ammo supplies dropped on the map!', 2500);
    if (NET.role === 'host') broadcast({t:'tst', x:'Ammo supplies dropped on the map!'});
  }
}
// ---- boats ----
function leaveBoat(a){
  const b = a.boat; if (!b) return;
  b.rider = null; a.boat = null; a.boatCool = 1.0;      // can't hop straight back on
  if (a.pid > 0) a.tpHold = 0;
}
// the player at this machine drives the boat; stepping onto land ends the ride
function rideBoat(a, vx, vy, dt){
  const b = a.boat, sp = Math.hypot(vx, vy);
  if (sp > 5) b.ang = Math.atan2(vy, vx);
  const nx = b.x + vx*dt, ny = b.y + vy*dt;
  if (inWater(nx, ny)){ b.x = nx; b.y = ny; a.x = nx; a.y = ny; return; }
  const ux = sp > 5 ? vx/sp : 0, uy = sp > 5 ? vy/sp : 0;                            // ran into land: climb out onto it
  a.x = nx + ux*14; a.y = ny + uy*14; leaveBoat(a); pushOutOfWater(a);
}
// boarding (walk up to a free boat) and remote riders (their reported position drives the boat)
function nearLakeWater(x,y){ return lakesOf().some(l => lakeIn(l, x, y, 8) && !onIsland(l, x, y, -8)); }
function boatStep(a){
  if (!a.isPlayer) return;
  const b = a.boat;
  if (b){
    if (!a.alive){ leaveBoat(a); return; }
    if (a.pid > 0 && a.tpHold > 0 && Math.hypot(a.x-b.x, a.y-b.y) < 60) a.tpHold = 0;   // guest has arrived on the boat
    if (a.pid > 0 && !(a.tpHold > 0)){
      if (!nearLakeWater(a.x, a.y)){ pushOutOfWater(a); leaveBoat(a); }
      else { const dx = a.x - b.x, dy = a.y - b.y; if (Math.hypot(dx, dy) > 0.5) b.ang = Math.atan2(dy, dx); b.x = a.x; b.y = a.y; }
    }
    return;
  }
  if (!a.alive || a.boatCool > 0) return;
  for (const bt of S.boats){
    if (bt.rider || Math.hypot(bt.x-a.x, bt.y-a.y) > 44) continue;
    bt.rider = a; a.boat = bt; a.x = a.tx = bt.x; a.y = a.ty = bt.y;
    const msg = 'You are on the boat! Steer into land to get out';
    if (a.pid === 0) toast(msg, 3000); else { a.tpHold = 1.2; peerSend(a.pid, {t:'tp', x:Math.round(bt.x), y:Math.round(bt.y), m:msg}); }
    break;
  }
}
function giveAmmo(a, l){
  const m = AMMO[l.type], n = l.n || m.box;
  if (a.ammo[m.gun] >= m.max) return false;
  a.ammo[m.gun] = Math.min(m.max, a.ammo[m.gun] + n);
  if (a === S.player) toast('+' + n + ' ' + m.name, 1200);
  return true;
}
function bestSlot(a){
  for (const t of WEAPON_PRIO){ const i = a.inv.indexOf(t); if (i >= 0 && a.ammo[t] > 0) return i; }
  return 0;
}

function openChest(c){
  c.open = true;
  const pick = () => CHEST_WEAPONS[Math.random()*CHEST_WEAPONS.length|0];
  const gun = () => ({type:pick(), rar:rollRarity()});
  const drops = [gun()];                                    // always one weapon (rarity rolled: mostly white, gold is about 1 in 100)
  if (Math.random() < 0.55) for (let i = 1 + (Math.random()*3|0); i > 0; i--) drops.push({type:'bandage'});   // 55%: 1-3 bandages
  if (Math.random() < 0.25) drops.push(gun());              // 25% chance of a bonus weapon
  if (Math.random() < 0.45) drops.push({type:'shield'});    // 45% shield potion
  if (Math.random() < 0.30) drops.push({type:'med'});       // 30% medkit
  if (c.boots) drops.push({type:'boots', rar:BOOT_RAR});
  if (c.flame) drops.push({type:'flame', rar:4});
  if (c.sniper) drops.push({type:'sniper', rar:4});
  if (Math.random() < GR_CHANCE) drops.push({type:'grenade', rar:4});   // 7%: a (gold) grenade
  drops.filter(d => GUN_W[d.type]).forEach(d => { if (!S.koth || Math.random() < 0.2) drops.push({type:'ammo_'+d.type, n:AMMO['ammo_'+d.type].box}); });      // every gun comes with a box of its bullets (King of the Hill: guns are plentiful, ammo comes from the drops)
  if (!S.koth && Math.random() < 0.4){ const t = ['ammo_pistol','ammo_shotgun','ammo_ar'][Math.random()*3|0]; drops.push({type:t, n:AMMO[t].box}); }   // 40%: an extra box
  if (c.island){ drops.push({type:pick(), rar:Math.max(rollRarity(), rollRarity())}); drops.push({type:'shield'}); }      // island chests are richer: a better gun and a shield potion
  const off = Math.random()*Math.PI*2;
  drops.forEach((dr,i) => {
    const ang = off + i*Math.PI*2/drops.length, d = rnd(40,55);
    S.loot.push({x:Math.max(20,Math.min(W-20,c.x+Math.cos(ang)*d)), y:Math.max(20,Math.min(W-20,c.y+Math.sin(ang)*d)), type:dr.type, rar:dr.rar || 0, n:dr.n});
  });
  burst(c.x, c.y, '#fc4', 14); sfx('cs', c.x, c.y);
}
// can this actor actually use a loot item right now? (keeps bots from chasing things they can't take)
function canTake(a, l){
  const type = l.type;
  if (type === 'wood') return true;
  if (AMMO[type]) return a.ammo[AMMO[type].gun] < AMMO[type].max;
  const st = STACK[type];
  if (st) return a[st.key] < st.max && (a.inv.includes(type) || a.inv.includes(null));     // only if there is room for it
  if (type === 'boots' || type === 'flame') return !a.inv.includes(type) && a.inv.includes(null);
  if (type === 'sniper') return !!a.isPlayer && !a.inv.includes(type) && a.inv.includes(null);
  if (type === 'grenade') return a.inv.includes(null);
  if (a.inv.includes(type)) return (l.rar || 0) > a.gr[type];     // already holding one: only a better one is worth taking
  return a.inv.includes(null);
}

function collide(a){
  for (const t of S.trees){
    const dx = a.x-t.x, dy = a.y-t.y, d = Math.hypot(dx,dy), m = a.r+t.r*0.8;
    if (d < m && d > 0){ a.x = t.x + dx/d*m; a.y = t.y + dy/d*m; }
  }
  const cx = Math.floor(a.x/G), cy = Math.floor(a.y/G);
  for (let gx=cx-1; gx<=cx+1; gx++) for (let gy=cy-1; gy<=cy+1; gy++){
    if (!S.walls.has(wallKey(gx,gy))) continue;
    const nx = Math.max(gx*G, Math.min(a.x, gx*G+G)), ny = Math.max(gy*G, Math.min(a.y, gy*G+G));
    const dx = a.x-nx, dy = a.y-ny, d = Math.hypot(dx,dy);
    if (d < a.r){
      if (d > 0){ a.x = nx + dx/d*a.r; a.y = ny + dy/d*a.r; }
      else a.y -= a.r;
    }
  }
  if (!a.boat) pushOutOfWater(a);
  a.x = Math.max(a.r, Math.min(W-a.r, a.x)); a.y = Math.max(a.r, Math.min(W-a.r, a.y));
}

// ---------- Bot AI ----------
function botThink(b, dt){
  const armed = b.inv.some(w => w && WEAP[w] && ((WEAP[w].spd && b.ammo[w] > 0) || WEAP[w].flame));
  const hill = S.koth ? S.hill : null, inHill = !!hill && Math.hypot(b.x-hill.x, b.y-hill.y) < hill.r*0.85;
  let target = null, best = armed ? 450 : (hill ? 230 : 110);   // unarmed bots only fight what is right next to them; otherwise they go find a chest

  }
  const sd = Math.hypot(b.x-S.storm.cx, b.y-S.storm.cy);

  } else if (target){
    const a = Math.atan2(target.y-b.y, target.x-b.x);
    const want = a + rnd(-0.05,0.05);
    const diff = Math.atan2(Math.sin(want-b.angle), Math.cos(want-b.angle));
    b.angle += diff * Math.min(1, dt*7);
    b.strafeT -= dt; if (b.strafeT <= 0){ b.strafe *= -1; b.strafeT = rnd(0.8,2); }

      if (!inHill){ mx = mx*0.3 + Math.cos(ha)*0.95; my = my*0.3 + Math.sin(ha)*0.95; }
      else if (dh > hill.r*0.6){ mx = mx*0.5 + Math.cos(ha)*0.7; my = my*0.5 + Math.sin(ha)*0.7; }
    }
    const gi = b.inv.indexOf('grenade');
    if (gi >= 0 && best > 150 && best < GR_RANGE - 30 && Math.random() < dt*1.2){ b.cur = gi; throwGrenade(b, target.x, target.y); return [0,0]; }
    // pick best weapon

    const cw = b.inv[b.cur], dead = !cw || (WEAP[cw] && WEAP[cw].spd && b.ammo[cw] <= 0) || (cw === 'flame' && b.flLock > 0);
    if (b.wpnT <= 0 || dead){

      if (fli >= 0 && !(b.flLock > 0) && best < (b.cur === fli ? FL_RANGE + 30 : FL_RANGE - 20)) c = fli;      // close enough to burn them (with some hysteresis)
      if (c !== b.cur){ b.cur = c; b.wpnT = 0.7; }
    }
    if (b.cur === 0 && best < 70 || b.cur !== 0 && Math.abs(diff) < 0.35) fire(b);
    if (b.cur === 0 && best > 70 && !(hill && inHill && Math.hypot(target.x-hill.x, target.y-hill.y) > hill.r)) { mx = Math.cos(a); my = Math.sin(a); }

    for (const l of S.loot){ if (!canTake(b, l) || nearLake(l.x, l.y, 0)) continue; const d = Math.hypot(l.x-b.x,l.y-b.y); if (d < nd){ nd = d; near = l; } }
    for (const c of S.chests){ if (c.open || c.island) continue; const d = Math.hypot(c.x-b.x,c.y-b.y); if (d < nd){ nd = d; near = c; } }
    // duo partners stick together: regroup if they have drifted apart

const BAD_PART = ['fuck','shit','bitch','cunt','nigg','fagg','whore','slut','rape','rapist','penis','vagina','pussy','bastard',
  'asshole','dildo','porn','nazi','hitler','molest','pedo','wank','jizz','blowjob','handjob','retard','tranny','dyke','kkk',
  'cocksuck','sex','motherf','bullshit','titties','boner','erotic','orgasm','genital','masturbat','vulva','rectum','scrotum'];
const BAD_WORD = ['ass','arse','tit','tits','cock','dick','dik','cum','sex','sexy','anus','fag','damn','hell','crap','piss',
  'boob','boobs','butt','nude','naked','nazi','coon','spic','kike','chink','gook','paki','homo','pimp','hoe','thot','balls','nuts','poop','fart'];
const LEET = {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','9':'g','@':'a','$':'s','!':'i','+':'t','|':'i','(':'c'};

const BAD_PART_RE = new RegExp(BAD_PART.map(looseRe).join('|'));
const BAD_WORD_RE = new RegExp('^(' + BAD_WORD.map(looseRe).join('|') + ')$');
function isBadName(name){
  const norm = String(name).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[0-9@$!+|(]/g, c => LEET[c] || c);
  const squashed = norm.replace(/[^a-z]/g, '').replace(/scunthorpe|essex|sussex|middlesex|wessex/g, '');   // innocent words that contain a blocked part
  if (BAD_PART_RE.test(squashed)) return true;
  // short words only count as whole words, so "Class" or "Hello" are fine
  return norm.split(/[^a-z]+/).some(t => t && BAD_WORD_RE.test(t));
}
function cleanName(n){
  const name = String(n == null ? '' : n).replace(/[\u0000-\u001f<>&"`]/g, '').trim().slice(0, 12);
  return isBadName(name) ? '' : name;
}
const rawName = () => String($('pname').value).replace(/[\u0000-\u001f<>&"`]/g, '').trim().slice(0, 12);

function nameAllowed(){

// every name in a room is unique (ignoring capitals and spaces), and nobody can pose as a bot ("Bot 7")
const nameKey = n => String(n).toLowerCase().replace(/\s+/g, '');
function uniqueName(name){
  const taken = n => NET.lobby.some(p => nameKey(p.name) === nameKey(n));
  if (/^bot\d*$/.test(nameKey(name))) name = 'Player';          // 'Bot 7' is reserved for the bots
  let n = name, i = 2;
  while (taken(n)){ const suf = ' ' + (i++); n = name.slice(0, 12 - suf.length) + suf; }
  return n;
}
function hostAcceptConnection(conn){

  conn.on('data', m => {
    if (pid !== null){ onHostData(pid, m); return; }
    if (!m || m.t !== 'hello') return;
    if (phase !== 'lobby') return reject('That match has already started.');
    if (NET.lobby.length >= MAX_PLAYERS) return reject('That room is full.');
    pid = NET.nextPid++;
    const name = uniqueName(cleanName(m.name) || 'Player ' + (pid+1));
    NET.peers[pid] = {conn, name};
    NET.lobby.push({pid, name, tm:null, bm:0, wins:0, shirt:okIdx(m.shirt, SHIRTS.length, 0), skin:okIdx(m.skin, SKINS.length, 1)});   // wins only count inside this room
    try { conn.send({t:'welcome', pid, name}); } catch(_){}

function onPeerLeft(pid){
  const peer = NET.peers[pid]; if (!peer) return;

  const name = peer.name;

  if (phase === 'lobby'){ lobbyBroadcast(); toast(name + ' left the room'); return; }

  if (g){            // a bot takes over (as a teammate if they were in a duo, otherwise on their own)
    g.isPlayer = false; g.pid = -1; g.name = name + ' (bot)'; g.in = null;
    S.players = S.players.filter(p => p !== g);

}

function clearInvites(pid){

    if (iv.to !== pid) peerSend(iv.to, {t:'invitegone', from:iv.from});   // their banner goes away

const teamTotal = p => teamOf(p).reduce((n, x) => n + 1 + (x.bm || 0), 0);      // humans plus their bot teammates
function fixTeams(){      // a team of one is not a team
  const n = {}; for (const p of NET.lobby) if (p.tm != null) n[p.tm] = (n[p.tm] || 0) + 1;
  for (const p of NET.lobby) if (p.tm != null && n[p.tm] < 2) p.tm = null;

function lobbyAction(pid, m){
  const me = lp(pid); if (!me || !m) return;
  if (NET.mode === 'koth' && m.t !== 'decline' && m.t !== 'leaveteam') return;      // King of the Hill is solo only
  if (m.t === 'invite'){
    const to = lp(m.to);
    if (!to || to.pid === pid || to.tm != null || teamTotal(me) + 1 + (to.bm || 0) > MAX_TEAM) return;
    if (NET.invites.some(iv => iv.from === pid && iv.to === to.pid)) return;
    NET.invites.push({from:pid, to:to.pid});
    peerSend(to.pid, {t:'invited', from:pid, name:me.name});
  } else if (m.t === 'accept'){
    const from = lp(m.from);
    if (!from || me.tm != null || teamTotal(from) + 1 + (me.bm || 0) > MAX_TEAM) return;
    if (!NET.invites.some(iv => iv.from === m.from && iv.to === pid)) return;
    if (from.tm == null) from.tm = from.pid;
    me.tm = from.tm;
    clearInvites(pid);
    if (teamTotal(from) >= MAX_TEAM) for (const q of teamOf(from)) clearInvites(q.pid);      // the team is full
    lobbyBroadcast();
  } else if (m.t === 'decline'){
    const i = NET.invites.findIndex(iv => iv.from === m.from && iv.to === pid);
    if (i >= 0){ NET.invites.splice(i, 1); peerSend(m.from, {t:'declined', by:pid, name:me.name}); }
  } else if (m.t === 'addbot'){
    if (NET.mode !== 'humans' && teamTotal(me) < MAX_TEAM){ me.bm = (me.bm || 0) + 1; lobbyBroadcast(); }
  } else if (m.t === 'rembot'){

}

// Guest simulation step: move myself locally, send my controls, smooth everyone else.
function updateGuest(dt){
  const me = S.player, st = S.storm;
  if (me.alive && !(me.down > 0)){
    const inp = localInput(me, dt), rvg = !!reviveTarget(me) && wantRevive();
    let vx = inp.vx*bootMul(me), vy = inp.vy*bootMul(me);
    if (rvg){ vx = vy = 0; inp.fire = false; }
    if (me.heal > 0){ vx *= 0.5; vy *= 0.5; }
    if (me.boat){ vx *= BOAT_MULT; vy *= BOAT_MULT; if (Math.hypot(vx, vy) > 5) me.boat.ang = Math.atan2(vy, vx); }
    if (!me.boat) [vx, vy] = iceVel(me, vx, vy, dt);
    me.x += vx*dt; me.y += vy*dt; collide(me);
    NET.inAcc += dt;
    if (NET.inAcc >= 1/30){ NET.inAcc = 0; netSend({t:'in', x:Math.round(me.x), y:Math.round(me.y), a:+me.angle.toFixed(3), f:inp.fire?1:0, r:rvg?1:0}); }
  }
  const k = Math.min(1, dt*14);
  for (const a of S.actors){
    if (a.heal > 0) a.heal -= dt;
    a.swing -= dt;
    if (a === me) continue;
    a.x += (a.tx - a.x)*k; a.y += (a.ty - a.y)*k;
    if (a.tang !== undefined) a.angle += Math.atan2(Math.sin(a.tang-a.angle), Math.cos(a.tang-a.angle))*k;
  }
  for (const bt of S.boats){ if (bt.tx !== undefined){ bt.x += (bt.tx - bt.x)*k; bt.y += (bt.ty - bt.y)*k; } }
  for (const b of S.bullets){ b.x += b.vx*dt; b.y += b.vy*dt; }
  st.t -= dt;
  stepParticles(dt);
  if (!NET.lost && performance.now() - NET.lastSnap > 5000){ NET.lost = true; toast('Connection lost… waiting for the host', 5000); }
}

// ---------- Menu / lobby ----------
let toastT;
function toast(t, ms){
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', ms || 3500);
}
const SCREENS = ['s-main','s-join','s-lobby'];
function showScreen(id){ for (const s of SCREENS) $(s).hidden = (s !== id); menuMsg(''); }
function menuMsg(t){ $('msg').textContent = t || ''; }
function hideMenu(){ $('menu').classList.add('hide'); $('exit').style.display = 'block'; }

// total Royale wins in solo and bot matches (kept on this device)
function getWins(){ try { return Math.max(0, parseInt(localStorage.getItem('sr-wins'), 10) || 0); } catch(_){ return 0; } }
function showWins(){ const e = $('wincount'); if (e) e.textContent = getWins(); }
function addRoyaleWin(){ try { localStorage.setItem('sr-wins', String(getWins() + 1)); } catch(_){} showWins(); }
showWins();
// the player's chosen name (remembered on this device)
try { $('pname').value = localStorage.getItem('sr-name') || ''; } catch(_){}
$('pname').addEventListener('input', () => { try { localStorage.setItem('sr-name', cleanName($('pname').value)); } catch(_){} });
const myName = () => cleanName($('pname').value);
function drawLookPreview(){
  const c = $('lookprev').getContext('2d'); c.clearRect(0,0,112,112);
  c.save(); c.translate(56,58); c.rotate(-Math.PI/2); c.scale(2.3,2.3); c.lineWidth = 2; c.strokeStyle = '#000'; c.lineJoin = 'round';
  drawPerson(c, SHIRTS[look.shirt], SKINS[look.skin], 0); c.restore();
}
function buildLookPickers(){
  const mk = (id, cols, key) => {
    const box = $(id); box.textContent = '';
    cols.forEach((col, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (look[key] === i ? ' on' : ''); b.style.background = col; b.setAttribute('aria-label', key + ' ' + (i+1));
      b.onclick = () => { look[key] = i; try { localStorage.setItem('sr-look', JSON.stringify(look)); } catch(_){} buildLookPickers(); playSnd('ui'); };
      box.appendChild(b);

  mk('shirts', SHIRTS, 'shirt'); mk('skins', SKINS, 'skin'); drawLookPreview();
}
buildLookPickers();

function renderLobby(){
  const kothSolo = NET.viewMode === 'koth';      // King of the Hill: no teams
  const list = (NET.view || []).map(p => kothSolo ? Object.assign({}, p, {tm:null, bm:0}) : p);
  const me = list.find(p => p.pid === NET.myPid);
  const humansMode = NET.viewMode === 'humans';
  const iAmSolo = !!me && me.tm == null, myTeam = me ? list.filter(x => me.tm != null ? x.tm === me.tm : x.pid === me.pid) : [], myTotal = myTeam.reduce((n, x) => n + 1 + (humansMode ? 0 : x.bm || 0), 0), canInvite = !!me && !kothSolo && myTotal < MAX_TEAM;
  for (const id of [...NET.sent]){ const p = list.find(x => x.pid === id); if (!p || p.tm != null) NET.sent.delete(id); }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const mkRow = p => {
    const r = el('div', 'prow' + (p.pid === NET.myPid ? ' me' : ''));
    const nm = el('span', 'nm', p.name);
    if (p.pid === NET.myPid) nm.appendChild(el('span', 'tag', '(you)'));
    if (p.pid === 0) nm.appendChild(el('span', 'tag', 'host'));
    nm.appendChild(el('span', 'tag win', '🏆 ' + (p.wins || 0)));
    if (!humansMode && p.bm) nm.appendChild(el('span', 'tag', '🤖 ×' + p.bm));
    r.appendChild(nm);
    if (p.pid === NET.myPid && !humansMode && !kothSolo){
      if (p.bm){ const rb = el('button', 'mini no', '− Bot'); rb.onclick = () => sendLobbyMsg({t:'rembot'}); r.appendChild(rb); }
      if (canInvite){ const ab = el('button', 'mini', '+ Bot teammate'); ab.onclick = () => sendLobbyMsg({t:'addbot'}); r.appendChild(ab); }
    }
    if (canInvite && p.pid !== NET.myPid && p.tm == null){
      const b = el('button', 'mini');
      if (NET.sent.has(p.pid)){ b.textContent = 'Invited'; b.disabled = true; }
      else {
        b.textContent = 'Team up';
        b.onclick = () => { NET.sent.add(p.pid); sendLobbyMsg({t:'invite', to:p.pid}); toast('Invite sent to ' + p.name); renderLobby(); };
      }
      r.appendChild(b);
    }
    return r;
  };

  const box = $('plist'); box.textContent = '';
  const seen = new Set();
  for (const p of list){
    if (seen.has(p.pid)) continue;
    seen.add(p.pid);
    if (p.tm != null){
      const members = list.filter(x => x.tm === p.tm);
      const t = el('div', 'team'); t.appendChild(el('div', 'tl', 'Team of ' + members.reduce((n, x) => n + 1 + (humansMode ? 0 : x.bm || 0), 0)));
      for (const m2 of members){ seen.add(m2.pid); t.appendChild(mkRow(m2)); }
      box.appendChild(t);
    } else box.appendChild(mkRow(p));
  }

  // invitations other players have sent me
  const inv = $('invites'); inv.textContent = '';
  NET.incoming = NET.incoming.filter(x => list.some(p => p.pid === x.from));
  if (iAmSolo) for (const iv of NET.incoming){
    const row = el('div', 'inv'); row.appendChild(el('span', null, iv.name + ' wants to team up'));
    const bt = el('span', 'bt');
    const ok = el('button', 'mini', 'Accept'), no = el('button', 'mini no', 'Decline');
    ok.onclick = () => { NET.incoming = NET.incoming.filter(x => x.from !== iv.from); sendLobbyMsg({t:'accept', from:iv.from}); renderLobby(); };
    no.onclick = () => { NET.incoming = NET.incoming.filter(x => x.from !== iv.from); sendLobbyMsg({t:'decline', from:iv.from}); renderLobby(); };
    bt.appendChild(ok); bt.appendChild(no); row.appendChild(bt); inv.appendChild(row);
  }

  const humansOnly = NET.viewMode === 'humans';
  const humans = list.map(p => ({pid:p.pid, tm:p.tm, bm:humansMode ? 0 : p.bm || 0})), plan = botPlan(humans, humansOnly, NET.viewMode === 'koth'), even = teamsEven(humans);
  const teams = new Set(humans.map(teamIdOf)).size, s = n => n === 1 ? '' : 's';
  $('lobby-info').textContent = list.length + ' player' + s(list.length) + ' in ' + teams + ' team' + s(teams) +
    (NET.viewMode === 'koth' ? '. King of the Hill: 10 players in total, bots fill the rest. Stand in the circle to score; when the storm closes on it the top score wins. You respawn when knocked out.' : humansOnly ? (teams < 2 ? '. Humans only: waiting for at least one more player or team.' : '. Humans only: no bots, a smaller starting area.')
                : '. Bots fill the rest: ' + plan.teams + ' team' + s(plan.teams) + ' of ' + plan.size + '.');
  const isHost = NET.role === 'host';
  document.querySelectorAll('#modebox .mini').forEach(bt => { bt.classList.toggle('sel', bt.dataset.mode === (NET.viewMode || 'bots')); bt.disabled = !isHost; });
  document.querySelectorAll('#mapbox-lobby .mini').forEach(bt => { bt.classList.toggle('sel', bt.dataset.map === (NET.viewMap || 'random')); bt.disabled = !isHost; });
  $('b-start').disabled = (humansOnly && teams < 2) || !even;
  if (!even) $('lobby-info').textContent = 'Teams must all be the same size (bot teammates count): add a bot teammate or invite players to even things out.';
  $('b-start').hidden = !isHost;
  $('wait-host').hidden = isHost;
  $('b-leaveteam').hidden = !(me && me.tm != null);
}

// The multiplayer library is only fetched when someone actually uses it, so solo play works fully offline.
const PEER_URLS = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
function loadPeer(ok, fail, i){
  i = i || 0;
  if (window.Peer) return ok();
  if (i >= PEER_URLS.length) return fail('Could not load the multiplayer library. Check your internet connection.');
  const s = document.createElement('script'); s.src = PEER_URLS[i];
  s.onload = ok; s.onerror = () => loadPeer(ok, fail, i+1);
  document.head.appendChild(s);
}
function genCode(){ const ch = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i=0;i<5;i++) s += ch[Math.random()*ch.length|0]; return s; }

function resetNet(){
  try { if (NET.peer) NET.peer.destroy(); } catch(_){}
  Object.assign(NET, {peer:null, conn:null, peers:{}, role:'solo', code:'', myPid:0, nextPid:1, lobby:[], view:null,
    invites:[], incoming:[], sent:new Set(), joinOk:null, joinFail:null});
  clearTimeout(NET.joinTimer);
  phase = 'menu';
}
function createRoom(tries){
  tries = tries || 0;
  const code = genCode(), peer = new Peer('stormroyale-'+code);
  NET.peer = peer;
  peer.on('open', () => {
    Object.assign(NET, {role:'host', code, myPid:0, nextPid:1, peers:{}, lobby:[{pid:0, name:myName() || 'Player 1', tm:null, bm:0, wins:0, shirt:look.shirt, skin:look.skin}],
      invites:[], incoming:[], sent:new Set(), mode:'bots', map:soloMap});
    phase = 'lobby'; $('roomcode').textContent = code; showScreen('s-lobby'); lobbyBroadcast();
  });
  peer.on('connection', hostAcceptConnection);
  peer.on('error', err => {
    if (err.type === 'unavailable-id' && tries < 5){ try { peer.destroy(); } catch(_){} createRoom(tries+1); return; }
    if (phase === 'menu'){ showScreen('s-main'); menuMsg('Could not create a room ('+err.type+'). Try again.'); }
  });
}
function joinRoom(code){
  const peer = new Peer(); NET.peer = peer; NET.code = code;
  let done = false;
  const fail = t => { if (done) return; done = true; clearTimeout(NET.joinTimer); resetNet(); showScreen('s-join'); menuMsg(t); };
  NET.joinFail = fail;
  NET.joinOk = () => { done = true; clearTimeout(NET.joinTimer); };
  NET.joinTimer = setTimeout(() => fail('Could not reach that room. Check the code, and that the host is waiting.'), 15000);
  peer.on('error', err => fail(err.type === 'peer-unavailable' ? 'Room not found. Check the code.' : 'Connection error ('+err.type+').'));
  peer.on('open', () => { guestAttach(peer.connect('stormroyale-'+code, {reliable:true}), myName()); });
}

$('b-solo').onclick = () => { if (!nameAllowed()) return; NET.role = 'solo'; init(null, false, soloMap, soloMode === 'koth'); phase = 'play'; hideMenu(); };
$('b-host').onclick = () => { if (!nameAllowed()) return; menuMsg('Connecting…'); loadPeer(() => createRoom(), menuMsg); };
$('b-join').onclick = () => { if (!nameAllowed()) return; showScreen('s-join'); $('code').focus(); };
$('b-go').onclick = () => {
  if (!nameAllowed()) return;
  const code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 5){ menuMsg('Enter the 5-character code.'); return; }
  menuMsg('Connecting…');
  loadPeer(() => joinRoom(code), menuMsg);
};
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('b-go').click(); });
$('b-start').onclick = hostBeginMatch;
document.querySelectorAll('#modebox .mini').forEach(bt => bt.onclick = () => { if (NET.role !== 'host' || phase !== 'lobby') return; NET.mode = bt.dataset.mode; if (NET.mode === 'koth'){ NET.lobby.forEach(q => { q.tm = null; q.bm = 0; }); NET.invites = []; } lobbyBroadcast(); });
let soloMode = 'classic'; try { soloMode = localStorage.getItem('sr-smode') === 'koth' ? 'koth' : 'classic'; } catch(_){}
const markSoloMode = () => document.querySelectorAll('#modebox-main .mini').forEach(bt => bt.classList.toggle('sel', bt.dataset.smode === soloMode));
document.querySelectorAll('#modebox-main .mini').forEach(bt => bt.onclick = () => { soloMode = bt.dataset.smode; try { localStorage.setItem('sr-smode', soloMode); } catch(_){} markSoloMode(); });
markSoloMode();
let soloMap = 'random'; try { soloMap = okMap(localStorage.getItem('sr-map')); } catch(_){}
const mapChoices = ['random', ...MAP_IDS];
function mkMapBox(id, onPick){
  const box = $(id);
  for (const m of mapChoices){ const b = document.createElement('button'); b.className = 'mini'; b.dataset.map = m; b.textContent = m === 'random' ? 'Random' : MAPS[m].name; b.onclick = () => onPick(m); box.appendChild(b); }
}
const markSoloMap = () => document.querySelectorAll('#mapbox-main .mini').forEach(bt => bt.classList.toggle('sel', bt.dataset.map === soloMap));
mkMapBox('mapbox-main', m => { soloMap = m; try { localStorage.setItem('sr-map', m); } catch(_){} markSoloMap(); });
mkMapBox('mapbox-lobby', m => { if (NET.role !== 'host' || phase !== 'lobby') return; NET.map = m; lobbyBroadcast(); });
markSoloMap();
$('b-leaveteam').onclick = () => sendLobbyMsg({t:'leaveteam'});
$('b-leave').onclick = () => { resetNet(); showScreen('s-main'); };
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => showScreen('s-main'));
$('exit').onclick = () => { if (confirm('Leave the match and return to the menu?')) location.reload(); };

// ---------- Loop ----------
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (phase === 'play'){
    if (NET.role === 'guest') updateGuest(dt);
    else {
      if (!S.over || S.actors.some(a => a.alive && !a.isPlayer)) update(dt);
      if (NET.role === 'host' && peerCount()){
        NET.snapAcc += dt;
        if (NET.snapAcc >= (peerCount() > 3 ? 1/15 : 1/20)){ NET.snapAcc = 0; sendSnapshot(); }   // 20 snapshots/s (15 with many players)
      }
    }
  }
  if (phase === 'play' && S.over && !S.sfxDone){
    S.sfxDone = true;
    if (NET.role === 'host') creditWins(); else if (NET.role === 'solo') soloCrown = S.winTeam !== null && S.winTeam === S.player.team;
    if (S.hasBots && !S.koth && S.winTeam !== null && S.winTeam === S.player.team) addRoyaleWin();       // solo and bot matches count toward your total (humans-only matches don't)
    if (!(S.winTeam !== null && S.winTeam === S.player.team)) playSnd('lose');     // winners hear the victory fanfare (music) instead
  }
  { const pl = (phase === 'play' && S && S.player) ? S.player : null, want = pl && pl.alive && pl.inv[pl.cur] === 'sniper' ? SN_ZOOM : 1;
    if (Math.abs(zmul - want) > 0.002){ zmul += (want - zmul) * Math.min(1, dt*5); applyZoom(); } else if (zmul !== want){ zmul = want; applyZoom(); } }
  draw();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>
